      const prev = state.currentRound;
      state.currentRound = Math.max(0, Math.min(15, n));
      state.phase = 'play';
      state.winner = null;
      state.revealRound = null;
      state.finalImageShow = null;
      // Each entry into rounds 11–15 requires the extra image to be shown again
      if (state.currentRound >= 11 && state.currentRound <= 15) {
        const idx = state.currentRound - 1;
        if (!state.rounds[idx]) {
          state.rounds[idx] = { x: null, y: null, question: '', questionImg: null, extraImage: null, extraImageShown: false };
        } else {

        state.players[i].hover = null;
        state.players[i].selected = null;
        state.players[i].confirmed = null;
        state.players[i].loggedIn = false;
        state.players[i].spyRadius = null;
        state.players[i].halfCover = null;
        state.players[i].x2Active = false;
        state.players[i].spyTarget = null;
      }
      if (playerId) {
        window._pinVisible = false;
        window._alertBlocksMove = false;
      }
      if (state.currentRound >= 1) {
        state.categoryShow = {
          active: true,
          categoryIndex: categoryIndexForRound(state.currentRound),
          lampIndex: lampIndexForRound(state.currentRound),
          startedAt: Date.now()
        };
        // sound on clients when they see category (all non-admin)
        try { playGameSfx('category'); } catch (e) {}
      } else {
        state.categoryShow = null;
      }
      saveState(state);
      ensureOverlayTick();
      render();
    };

    window.setCategoryName = function(ci, name) {
      const state = getState();
      if (!state.categories) state.categories = [{name:'',icon:null},{name:'',icon:null},{name:'',icon:null}];
      state.categories[ci].name = (name || '').trim();
      saveState(state);
      render();
    };
    window.onCategoryIcon = function(ci, input) {
      const file = input.files && input.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = async () => {
        try {
          const compressed = await compressImage(reader.result, 128, 0.8);
          const state = getState();
          if (!state.categories) state.categories = [{name:'',icon:null},{name:'',icon:null},{name:'',icon:null}];
          state.categories[ci].icon = compressed;
          saveState(state);
          render();
        } catch (e) { alert('Icon fehlgeschlagen'); }
      };
      reader.readAsDataURL(file);
    };
    window.clearCategoryIcon = function(ci) {
      const state = getState();
      if (state.categories && state.categories[ci]) state.categories[ci].icon = null;
      saveState(state);
      render();
    };
    window.onRoundExtraImage = function(roundNum, input) {
      const file = input.files && input.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = async () => {
        try {
          const compressed = await compressImage(reader.result, 1000, 0.85);
          const state = getState();
          const idx = roundNum - 1;
          if (!state.rounds[idx]) state.rounds[idx] = { x: null, y: null, question: '', questionImg: null };
          state.rounds[idx].extraImage = compressed;
          state.rounds[idx].extraImageShown = false;
          saveState(state);
          render();
        } catch (e) { alert('Bild fehlgeschlagen'); }
      };
      reader.readAsDataURL(file);
    };
    window.clearRoundExtraImage = function(roundNum) {
      const state = getState();
      const idx = roundNum - 1;
      if (state.rounds[idx]) {
        state.rounds[idx].extraImage = null;
        state.rounds[idx].extraImageShown = false;
      }
      if (state.finalImageShow && state.finalImageShow.round === roundNum) state.finalImageShow = null;
      saveState(state);
      render();
    };
    window.showFinalImage = function(roundNum) {
      const state = getState();
      const rn = roundNum || state.currentRound;
      if (rn < 11 || rn > 15) { alert('Nur in Runden 11–15'); return; }
      if (state.currentRound !== rn) { alert('Bitte zuerst Runde ' + rn + ' aktivieren'); return; }
      const rd = state.rounds[rn - 1];
      if (!rd || !rd.extraImage) { alert('Kein Extra-Bild für diese Runde'); return; }
      state.finalImageShow = { active: true, startedAt: Date.now(), round: rn, image: rd.extraImage };
      state.categoryShow = null;
      for (let i = 1; i <= 4; i++) {
        if (!state.players[i]) continue;
        state.players[i].hover = null;
        state.players[i].selected = null;
      }
      saveState(state);
      ensureOverlayTick();
      render();
    };

    let _hoverSyncAt = 0;
    let _solDragging = false;
    let _solDragMoved = false;

    window.onFreeMapMove = function(e) {
      if (!playerId) return;
      window._mapPointerInside = true;
      if (window._alertBlocksMove) return;
      if (!window._pinVisible) return;
      const state = getState();
      if (isPlayLocked(state)) return;
      const p = state.players[playerId];
      if (p.loggedIn || state.phase === 'reveal' || p.selected) return;
      const stage = e.currentTarget;
      const rect = stage.getBoundingClientRect();
      const x = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
      const y = Math.max(0, Math.min(1, (e.clientY - rect.top) / rect.height));
      const pins = stage.querySelectorAll('.map-pin.obs-pin-p' + playerId);
      pins.forEach(pin => {
        pin.style.left = (x * 100) + '%';
        pin.style.top = (y * 100) + '%';
      });
      const now = Date.now();
      if (p.hover && Math.abs(p.hover.x - x) < 0.001 && Math.abs(p.hover.y - y) < 0.001) return;
      // Always update local hover; broadcast ~50/s for smooth OBS
      p.hover = { x, y };
      if (now - _hoverSyncAt < 20) return;
      _hoverSyncAt = now;
      updatePlayer(playerId, { hover: { x, y } }, { hoverOnly: true });
    };

    window.onFreeMapClick = function(e) {
      if (!playerId || e.button === 2) return;
      if (window._alertBlocksMove) return;
      if (!window._pinVisible) return;
      const state = getState();
      if (isPlayLocked(state)) return;
      const p = state.players[playerId];
      if (p.loggedIn || state.phase === 'reveal') return;
      const stage = e.currentTarget;
      const rect = stage.getBoundingClientRect();
      const x = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
      const y = Math.max(0, Math.min(1, (e.clientY - rect.top) / rect.height));
      if (p.selected && p.selected.x != null && Math.abs(p.selected.x - x) < 0.02 && Math.abs(p.selected.y - y) < 0.02) {
        updatePlayer(playerId, { selected: null, hover: { x, y } });
      } else {
        updatePlayer(playerId, { selected: { x, y }, hover: { x, y } });
      }
      render();
    };

    // Right-click: show pin when on map, hide when off map (or toggle hide when visible)
    window.onPinToggle = function(e) {
      if (!playerId) return;
      e.preventDefault();
      e.stopPropagation();
      if (window._alertBlocksMove) return;
      const state = getState();
      if (isPlayLocked(state)) return;
      const p = state.players[playerId];
      if (p.loggedIn || state.phase === 'reveal') return;

      if (!window._pinVisible) {
        // Appear at cursor
        window._pinVisible = true;
        window._mapPointerInside = true;
        const stage = e.currentTarget;
        const rect = stage.getBoundingClientRect();
        const x = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
        const y = Math.max(0, Math.min(1, (e.clientY - rect.top) / rect.height));
        const hover = { x, y };
        updatePlayer(playerId, { hover, selected: null });
        broadcastPinHover(playerId, hover, { create: true });
        render();
      } else {
        // Hide pin
        window._pinVisible = false;
        updatePlayer(playerId, { hover: null, selected: null });
        broadcastPinHover(playerId, null);
        render();
      }
    };

    window.onMapPlace = function(e) {
      if (_solDragMoved) { _solDragMoved = false; return; }
      const state = getState();
      if (state.phase !== 'play') return;
      if (state.currentRound < 1) return;
      const stage = e.currentTarget;
      const rect = stage.getBoundingClientRect();
      const x = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
      const y = Math.max(0, Math.min(1, (e.clientY - rect.top) / rect.height));
      const round = state.currentRound;
      const prev = state.rounds[round - 1] || {};
      state.rounds[round - 1] = {
        x, y,
        question: prev.question || '',
        questionImg: prev.questionImg || null
      };
      saveState(state);
      render();
    };

    window.onSolStageDown = function(e) {
      // ignore – drag starts on the dot itself
    };

    window.startSolDrag = function(e) {
      e.preventDefault();
      e.stopPropagation();
      _solDragging = true;
      _solDragMoved = false;
      const move = (ev) => {
        if (!_solDragging) return;
        _solDragMoved = true;
        const stage = document.querySelector('.map-stage');
        if (!stage) return;
        const rect = stage.getBoundingClientRect();
        const x = Math.max(0, Math.min(1, (ev.clientX - rect.left) / rect.width));
        const y = Math.max(0, Math.min(1, (ev.clientY - rect.top) / rect.height));
        const dot = document.querySelector('.solution-dot.editable');
        if (dot) {
          dot.style.left = (x * 100) + '%';
          dot.style.top = (y * 100) + '%';
        }
        // store temp on window for mouseup
        window._solDragPos = { x, y };
      };
      const up = () => {
        document.removeEventListener('mousemove', move);
        document.removeEventListener('mouseup', up);
        _solDragging = false;
        if (window._solDragPos) {
          const state = getState();
          if (state.phase === 'play' && state.currentRound >= 1) {
            const prev = state.rounds[state.currentRound - 1] || {};
            state.rounds[state.currentRound - 1] = {
              x: window._solDragPos.x,
              y: window._solDragPos.y,
              question: prev.question || '',
              questionImg: prev.questionImg || null
            };
            saveState(state);
            render();
          }
          window._solDragPos = null;
        }
      };
      document.addEventListener('mousemove', move);
      document.addEventListener('mouseup', up);
    };

    window.setGlobalGridSize = function(sz) {
      const state = getState();
      if (state.phase === 'reveal') return;
      state.gridSize = sz;
      // Clear all placements when switching grid mode
      for (let i = 1; i <= 4; i++) {
        const p = state.players[i];
        if (!p) continue;
        p.hover = null;
        p.selected = null;
        p.confirmed = null;
        p.loggedIn = false;
      }
      saveState(state);
      render();
    };

    window.setRoundQuestion = function(roundNum, text) {
      const state = getState();
      const idx = roundNum - 1;
      if (!state.rounds[idx]) state.rounds[idx] = { x: null, y: null, question: '', questionImg: null };
      state.rounds[idx].question = (text || '').trim();
      saveState(state);
    };

    window.onQuestionImg = async function(roundNum, input) {
      const file = input.files && input.files[0];
      if (!file || !file.type.startsWith('image/')) return;
      const reader = new FileReader();
      reader.onload = async () => {
        try {
          const compressed = await compressImage(reader.result, 96, 0.75);
          const state = getState();
          const idx = roundNum - 1;
          if (!state.rounds[idx]) state.rounds[idx] = { x: null, y: null, question: '', questionImg: null };
          state.rounds[idx].questionImg = compressed;
          saveState(state);
          render();
        } catch (e) {
          alert('Bild konnte nicht verarbeitet werden.');
        }
      };
      reader.readAsDataURL(file);
    };

    window.clearQuestionImg = function(roundNum) {
      const state = getState();
      const idx = roundNum - 1;
      if (state.rounds[idx]) state.rounds[idx].questionImg = null;
      saveState(state);
      render();
    };

    window.onZoomChange = function(val) {
      const n = parseInt(val, 10);
      if (isNaN(n)) return;
      const zoom = Math.max(1, Math.min(2.5, n / 100));
      const state = getState();
      state.mapZoom = zoom;
      saveState(state);
      const el = document.getElementById('zoomVal');
      if (el) el.textContent = Math.round(zoom * 100) + '%';
      // update CSS var live without full re-render of inputs
      document.querySelectorAll('.map-wrap').forEach(w => {
        w.style.setProperty('--map-zoom', String(zoom));
      });
    };

    window.onCellHover = function(r, c) {
      if (!playerId) return;
      const state = getState();
      const p = state.players[playerId];
      if (p.loggedIn || state.phase === 'reveal') return;
      // While a cell is selected, freeze hover coloring (keep selection only)
      if (p.selected) return;
      if (p.hover && p.hover.r === r && p.hover.c === c) return;
      updatePlayer(playerId, { hover: { r, c } });
    };

    window.onMapLeave = function() {
      if (!playerId) return;
      window._mapPointerInside = false;
      const state = getState();
      const p = state.players[playerId];
      if (p.loggedIn || state.phase === 'reveal') return;
      // Clear hover when mouse leaves (selection stays if set)
      if (p.hover && !p.selected) {
        updatePlayer(playerId, { hover: null });
      }
    };

    window.onCellClick = function(r, c) {
      if (!playerId) return;
      const state = getState();
      const p = state.players[playerId];
      if (p.loggedIn || state.phase === 'reveal') return;
      // Toggle: click same cell again to deselect
      if (p.selected && p.selected.r === r && p.selected.c === c) {
        updatePlayer(playerId, { selected: null, hover: { r, c } });
      } else {
        updatePlayer(playerId, { selected: { r, c }, hover: { r, c } });
      }
      render();
    };

    window.doLogin = function() {
      if (!playerId) return;
      const state = getState();
      if (isPlayLocked(state)) return;
      const p = state.players[playerId];
      if (!p.selected || p.loggedIn || state.phase === 'reveal') return;
      // Sound nur in OBS (maybePlayLoginSound)

      localLoginPop[playerId] = true;
      updatePlayer(playerId, {
        confirmed: { ...p.selected },
        loggedIn: true,
        hover: null,
        selected: null,
        spyRadius: null,
        halfCover: null
      });
      render();
      setTimeout(() => {
        localLoginPop[playerId] = false;
        window.dispatchEvent(new Event('map-update'));
      }, 600);
    };

    window.clearSelection = function() {
      if (!playerId) return;
      const state = getState();
      if (state.players[playerId].loggedIn) return;
      updatePlayer(playerId, { selected: null });
      render();
    };

    window.resetAllRounds = function() {
      if (!confirm('Alle Lösungspunkte und Spielerstatus zurücksetzen? (Fragen bleiben erhalten)')) return;
      stopPathAnim();
      localLoginPop = { 1: false, 2: false, 3: false, 4: false };
      const state = getState();
      state.phase = 'play';
      state.winner = null;
      state.revealRound = null;
      state.jokerRoundUsed = null;
      state.scoreAwardedRound = null;
      state.currentRound = 0;
      state.scores = { 1: 0, 2: 0, 3: 0, 4: 0 };
      for (let i = 1; i <= 4; i++) {
        if (!state.players[i]) continue;
        state.players[i].hover = null;
        state.players[i].selected = null;
        state.players[i].confirmed = null;
        state.players[i].loggedIn = false;
        state.players[i].spyRadius = null;
        state.players[i].halfCover = null;
        state.players[i].x2Active = false;
        state.players[i].spyTarget = null;
      }
      // Clear solution points only – keep questions & images
      state.rounds = (state.rounds || []).map(r => ({
        x: null, y: null,
        question: (r && r.question) || '',
        questionImg: (r && r.questionImg) || null
      }));
      while (state.rounds.length < 15) {
        state.rounds.push({ x: null, y: null, question: '', questionImg: null });
      }
      saveState(state);
      render();
    };

    window.resetRound = function() {
      stopPathAnim();
      localLoginPop = { 1: false, 2: false, 3: false, 4: false };
      const state = getState();
      state.phase = 'play';
      state.winner = null;
      state.revealRound = null;
      state.jokerRoundUsed = null;
      for (let i = 1; i <= 4; i++) {
        if (!state.players[i]) continue;
        state.players[i].hover = null;
        state.players[i].selected = null;
        state.players[i].confirmed = null;
        state.players[i].loggedIn = false;
        state.players[i].spyRadius = null;
        state.players[i].halfCover = null;
        state.players[i].x2Active = false;
        state.players[i].spyTarget = null;
      }
      saveState(state);
      render();
    };

    window.resetAllPlayers = function() {
      stopPathAnim();
      localLoginPop = { 1: false, 2: false, 3: false, 4: false };
      const state = getState();
      state.phase = 'play';
      state.winner = null;
      state.revealRound = null;
      state.jokerRoundUsed = null;
      for (let i = 1; i <= 4; i++) {
        if (!state.players[i]) continue;
        state.players[i].hover = null;
        state.players[i].selected = null;
        state.players[i].confirmed = null;
        state.players[i].loggedIn = false;
        state.players[i].spyRadius = null;
        state.players[i].halfCover = null;
        state.players[i].x2Active = false;
        state.players[i].spyTarget = null;
      }
      saveState(state);
      render();
    };

    window.resetJokerRoundUse = function() {
      const state = getState();
      const used = state.jokerRoundUsed;
      if (used && used.playerId && used.type) {
        const p = state.players[used.playerId];
        if (p) {
          if (!p.jokers) p.jokers = { spy: true, half: true, x2: true };
          p.jokers[used.type] = true; // give joker back
          if (used.type === 'spy') p.spyRadius = null;
          if (used.type === 'half') p.halfCover = null;
          if (used.type === 'x2') p.x2Active = false;
        }
      }
      state.jokerRoundUsed = null;
      state.lastObsJokerMsg = null;
      saveState(state);
      render();
    };

    window.adminResetJokers = function(pid) {
      const state = getState();
      state.players[pid].jokers = { spy: true, half: true, x2: true };
      state.players[pid].spyRadius = null;
      state.players[pid].halfCover = null;
      state.players[pid].x2Active = false;
      saveState(state);
      render();
    };

    window.adminClearJoker = function(pid, type) {
      const state = getState();
      if (!state.players[pid].jokers) state.players[pid].jokers = { spy: true, half: true, x2: true };
      // Toggle availability
      const now = !state.players[pid].jokers[type];
      state.players[pid].jokers[type] = now;
      if (!now) {
        if (type === 'spy') state.players[pid].spyRadius = null;
        if (type === 'half') state.players[pid].halfCover = null;
        if (type === 'x2') state.players[pid].x2Active = false;
      }
      saveState(state);
      render();
    };

    // ===== Reveal + Pathfinding =====
    function stopPathAnim() {
      if (pathAnim && pathAnim.timer) clearInterval(pathAnim.timer);
      if (pathAnim && pathAnim.countTimer) clearInterval(pathAnim.countTimer);
      pathAnim = null;
    }

    function bfsPath(start, goal, gridSize) {
      if (start.r === goal.r && start.c === goal.c) return [[start.r, start.c]];
      const key = (r, c) => r + ',' + c;
      const q = [{ r: start.r, c: start.c }];
      const prev = new Map();
      prev.set(key(start.r, start.c), null);
      const dirs = [[0,1],[1,0],[0,-1],[-1,0]];

      while (q.length) {
        const cur = q.shift();
        for (const [dr, dc] of dirs) {
          const nr = cur.r + dr;
          const nc = cur.c + dc;
          if (nr < 0 || nr >= gridSize || nc < 0 || nc >= gridSize) continue;
          const k = key(nr, nc);
          if (prev.has(k)) continue;
          prev.set(k, cur);
          if (nr === goal.r && nc === goal.c) {
            const path = [[nr, nc]];
            let p = cur;
            while (p) {
              path.push([p.r, p.c]);
              p = prev.get(key(p.r, p.c));
            }
            return path.reverse();
          }
          q.push({ r: nr, c: nc });
        }
      }
      return [[start.r, start.c], [goal.r, goal.c]];
    }

    window.startReveal = function() {
      const state = getState();
      if (!allActiveLoggedIn(state)) {
        alert('Alle aktiven Spieler müssen eingeloggt sein.');
        return;
      }
      const round = state.currentRound;
      if (round < 1) {
        alert('Bitte zuerst eine Runde (1–15) wählen.');
        return;
      }
      const pt = state.rounds[round - 1];
      if (!pt || pt.x == null) {
        alert('Bitte zuerst einen Lösungspunkt für diese Runde setzen.');
        return;
      }

      stopPathAnim();
      state.phase = 'reveal';
      state.revealRound = round;
      state.winner = null;
      saveState(state);
      ensureRevealAnim(state);
      render();
    };

    // ===== Events =====
    function updateRevealLinesOnly() {
      if (!pathAnim || !pathAnim.linesReady || !pathAnim.solPt) return;
      const svg = document.querySelector('.reveal-lines-svg') || document.querySelector('svg.reveal-lines');
      // Update line endpoints via existing path elements if present
      const ids = pathAnim.playerIds || [1, 2];
      ids.forEach(id => {
        const line = document.querySelector('.reveal-line-p' + id) || document.querySelector('[data-reveal-line="' + id + '"]');
        if (!line) return;
        const t = (pathAnim.targets && pathAnim.targets[id]) || null;
        if (!t) return;
        const pr = (pathAnim.progress && pathAnim.progress[id] != null) ? pathAnim.progress[id] : 0;
        const x1 = pathAnim.solPt.x * 100;
        const y1 = pathAnim.solPt.y * 100;
        const x2 = t.x * 100;
        const y2 = t.y * 100;
        const cx = x1 + (x2 - x1) * pr;
        const cy = y1 + (y2 - y1) * pr;
        if (line.tagName === 'line') {
          line.setAttribute('x1', x1);
          line.setAttribute('y1', y1);
          line.setAttribute('x2', cx);
          line.setAttribute('y2', cy);
        } else if (line.tagName === 'path') {
          line.setAttribute('d', 'M ' + x1 + ' ' + y1 + ' L ' + cx + ' ' + cy);
        }
      });
    }
    window.addEventListener('map-update', (e) => {
      if (!isAuthenticated()) return;
      const soft = e && e.detail && e.detail.soft;
      if (soft === 'reveal-lines') {
        updateRevealLinesOnly();
        return;
      }
      if (soft === 'score-anim') {
        updateScoreAnimDom();
        return;
      }
      render();
    });

    window.addEventListener('storage', (e) => {
      if (e.key === LOCAL_CACHE_KEY && isAuthenticated()) {
        stateCache = loadLocalCache();
        render();
      }
    });

    // Boot
    (async function boot() {
      try { initGalaxy(); } catch (e) {}
      if (isAuthenticated()) {
        await ensureRoom();
        loadLocalMap();
        loadLocalAvatars();
      }
      render();
      setInterval(() => {
        if (!isAuthenticated()) return;
        if (isObs || mode === 'admin' || playerId) {
          // light refresh for hover sync
        }
      }, 2000);
    })();
  </script>

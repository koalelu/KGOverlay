    function broadcastAvatarOne(pid) {
      if (!realtimeChannel || !roomId) return;
      const data = localAvatars[pid];
      if (!data) return;
      try {
        realtimeChannel.send({
          type: 'broadcast',
          event: 'avatar-one',
          payload: { playerId: pid, avatar: data, v: Date.now() }
        });
      } catch (e) {
        console.warn('broadcastAvatarOne failed', e);
      }
    }
    function broadcastAvatars() {
      if (!realtimeChannel || !roomId) return;
      // Send one-by-one (avoids oversized single payload dropping all avatars)
      for (const pid of [1, 2, 3, 4]) {
        if (localAvatars[pid]) {
          try {
            broadcastAvatarOne(pid);
          } catch (e) {}
        }
      }
      // Also try a slim presence ping so clients know to request if needed
      try {
        realtimeChannel.send({
          type: 'broadcast',
          event: 'avatars-meta',
          payload: {
            has: {
              1: !!localAvatars[1],
              2: !!localAvatars[2],
              3: !!localAvatars[3],
              4: !!localAvatars[4]
            }
          }
        });
      } catch (e) {}
    }

    function requestMap() {
      if (!realtimeChannel || !roomId) return;
      try {
        realtimeChannel.send({
          type: 'broadcast',
          event: 'request-map',
          payload: { from: mode }
        });
      } catch (e) {}
    }

    function missingAvatarIds(state) {
      const ids = (state && typeof activePlayerIds === 'function')
        ? activePlayerIds(state)
        : [1, 2, 3, 4];
      return ids.filter(id => !localAvatars[id]);
    }
    let _lastAvatarRequestAt = 0;
    function requestAvatars(force) {
      if (!realtimeChannel || !roomId) return;
      const now = Date.now();
      if (!force && now - _lastAvatarRequestAt < 2500) return;
      _lastAvatarRequestAt = now;
      try {
        realtimeChannel.send({
          type: 'broadcast',
          event: 'request-avatars',
          payload: { from: mode, missing: missingAvatarIds(getState()) }
        });
      } catch (e) {}
    }

    function subscribeToRoom(id) {
      if (realtimeChannel) {
        sb.removeChannel(realtimeChannel);
        realtimeChannel = null;
      }

      realtimeChannel = sb
        .channel('map-room:' + id)
        .on(
          'postgres_changes',
          {
            event: 'UPDATE',
            schema: 'public',
            table: 'rooms',
            filter: 'id=eq.' + id
          },
          (payload) => {
            if (!payload.new || !payload.new.state) return;
            const remote = normalizeState(payload.new.state);
            const h = stateHash(remote);
            if (h !== lastRemoteHash) {
              // If only hover positions changed, update pins without full re-render
              const prev = stateCache;
              const hoverOnly = prev && prev.players && remote.players && (() => {
                try {
                  const a = JSON.parse(JSON.stringify(prev));
                  const b = JSON.parse(JSON.stringify(remote));
                  for (const id of [1, 2]) {
                    if (a.players[id]) a.players[id].hover = null;
                    if (b.players[id]) b.players[id].hover = null;
                  }
                  return JSON.stringify(a) === JSON.stringify(b);
                } catch (e) { return false; }
              })();
              lastRemoteHash = h;
              stateCache = remote;
              try { mergeRemoteLayoutsIntoObsPos(remote); } catch (e) {}
              saveLocalCache(remote);
              syncStatus = 'ok';
              if (remote.mapPublished && !localMapImage) requestMap();
              if (hoverOnly) {
                for (const id of [1, 2]) {
                  const hv = remote.players[id] && remote.players[id].hover;
                  if (hv && hv.x != null) applyPinHoverDom(id, hv.x, hv.y);
                }
              } else {
                window.dispatchEvent(new Event('map-update'));
              }
            }
          }
        )
        .on('broadcast', { event: 'map' }, ({ payload }) => {
          if (!payload || !payload.image) return;
          saveLocalMap(payload.image);
          window.dispatchEvent(new Event('map-update'));
        })
        .on('broadcast', { event: 'request-map' }, () => {
          if (localMapImage) broadcastMap();
        })
        .on('broadcast', { event: 'avatar-one' }, ({ payload }) => {
          if (!payload || !payload.playerId || !payload.avatar) return;
          const pid = Number(payload.playerId);
          if (pid < 1 || pid > 4) return;
          if (localAvatars[pid] === payload.avatar) return;
          localAvatars[pid] = payload.avatar;
          saveLocalAvatars(localAvatars);
          window.dispatchEvent(new Event('map-update'));
        })
        .on('broadcast', { event: 'avatars' }, ({ payload }) => {
          // legacy full payload
          if (!payload || !payload.avatars) return;
          const incoming = normalizeAvatarsObj(payload.avatars);
          let changed = false;
          for (const id of [1, 2, 3, 4]) {
            if (incoming[id] && incoming[id] !== localAvatars[id]) {
              localAvatars[id] = incoming[id];
              changed = true;
            }
          }
          if (changed) {
            saveLocalAvatars(localAvatars);
            window.dispatchEvent(new Event('map-update'));
          }
        })
        .on('broadcast', { event: 'avatars-meta' }, ({ payload }) => {
          if (!payload || !payload.has) return;
          const miss = [1,2,3,4].filter(id => payload.has[id] && !localAvatars[id]);
          if (miss.length) requestAvatars(true);
        })
        .on('broadcast', { event: 'request-avatars' }, () => {
          if (localAvatars[1] || localAvatars[2] || localAvatars[3] || localAvatars[4]) {
            // stagger slightly so channel isn't flooded
            let delay = 0;
            for (const pid of [1, 2, 3, 4]) {
              if (localAvatars[pid]) {
                setTimeout(() => broadcastAvatarOne(pid), delay);
                delay += 80;
              }
            }
          }
        })
        .on('broadcast', { event: 'pin-hover' }, ({ payload }) => {
          if (!payload || !payload.playerId) return;
          const pid = payload.playerId;
          // Ignore own echo
          if (playerId && pid === playerId) return;
          if (!stateCache || !stateCache.players || !stateCache.players[pid]) return;
          if (stateCache.players[pid].loggedIn) return;
          if (payload.visible === false || payload.x == null) {
            stateCache.players[pid].hover = null;
            stateCache.players[pid].selected = null;
            window.dispatchEvent(new Event('map-update'));
            return;
          }
          const x = payload.x, y = payload.y;
          stateCache.players[pid].hover = { x, y };
          const exists = document.querySelectorAll('.map-pin.obs-pin-p' + pid).length > 0;
          if (!exists || payload.create) {
            window.dispatchEvent(new Event('map-update'));
          } else {
            applyPinHoverDom(pid, x, y, false);
            return; // no full re-render
          }
        })
        .subscribe((status) => {
          if (status === 'SUBSCRIBED') {
            syncStatus = 'ok';
            const st = getState();
            if (st.mapPublished) {
              if (!localMapImage) requestMap();
              else if (mode === 'admin') broadcastMap();
            }
            if (mode === 'admin') {
              if (localAvatars[1] || localAvatars[2] || localAvatars[3] || localAvatars[4]) broadcastAvatars();
            }
            // Always request if any active player is missing an avatar (e.g. OBS has 1+2 but not 3+4)
            try {
              if (missingAvatarIds(getState()).length) requestAvatars(true);
            } catch (e) {
              requestAvatars(true);
            }
            window.dispatchEvent(new Event('map-update'));
          } else if (status === 'CHANNEL_ERROR' || status === 'TIMED_OUT') {
            syncStatus = 'err';
            window.dispatchEvent(new Event('map-update'));
          }
        });
    }

    async function ensureRoom() {
      let id = getRoomFromUrl() || getLocalRoom();

      if (id && id.length > 20) {
        id = null;
        try { localStorage.removeItem(LOCAL_ROOM_KEY); } catch (e) {}
      }

      if (id) {
        roomId = id;
        setLocalRoom(id);
        loadLocalMap();
        loadLocalAvatars();
        try {
          const remote = await fetchRemoteState(id);
          if (remote) {
            stateCache = normalizeState(remote);
            try { mergeRemoteLayoutsIntoObsPos(stateCache); } catch (e) {}
            try { attachObsPosToState(stateCache); } catch (e) {}
            saveLocalCache(stateCache);
            lastRemoteHash = stateHash(stateCache);
            syncStatus = 'ok';
            subscribeToRoom(id);
            try {
              await pushRemoteState(id, stateCache);
              lastRemoteHash = stateHash(stateForRemote(stateCache));
            } catch (pe) {
              console.warn('slim-push failed', pe);
            }
            return id;
          }
          const init = makeDefaultState();
          const { error } = await sb.from('rooms').insert({ id, state: init });
          if (error) throw error;
          stateCache = init;
          saveLocalCache(init);
          lastRemoteHash = stateHash(init);
          syncStatus = 'ok';
          subscribeToRoom(id);
          return id;
        } catch (e) {
          console.error('ensureRoom (existing) failed:', e);
          syncStatus = 'err';
          stateCache = normalizeState(loadLocalCache());
          return id;
        }
      }

      try {
        id = await createRemoteRoom();
        roomId = id;
        setLocalRoom(id);
        stateCache = makeDefaultState();
        saveLocalCache(stateCache);
        lastRemoteHash = stateHash(stateCache);
        syncStatus = 'ok';
        subscribeToRoom(id);

        const url = new URL(window.location.href);
        url.searchParams.set('room', id);
        window.history.replaceState({}, '', url.toString());
        return id;
      } catch (e) {
        console.error('ensureRoom (create) failed:', e);
        syncStatus = 'err';
        roomId = null;
        stateCache = normalizeState(loadLocalCache());
        return null;
      }
    }

    function getState() {
      if (stateCache) return stateCache;
      return loadLocalCache();
    }

    async function saveState(state, opts) {
      opts = opts || {};
      // Never drop OBS layouts: keep memory/current or previous cache
      try {
        if (typeof attachObsPosToState === 'function' && obsPos && obsPos.updatedAt) {
          attachObsPosToState(state);
        } else if (stateCache) {
          if (state.obsLayouts2 == null && stateCache.obsLayouts2) state.obsLayouts2 = stateCache.obsLayouts2;
          if (state.obsLayouts4 == null && stateCache.obsLayouts4) state.obsLayouts4 = stateCache.obsLayouts4;
        }
      } catch (e) {}
      stateCache = normalizeState(state);
      saveLocalCache(stateCache);
      window.dispatchEvent(new Event('map-update'));

      if (opts.localOnly) return;

      if (!roomId) {
        syncStatus = 'err';
        lastSyncError = 'Kein Raum';
        window.dispatchEvent(new Event('map-update'));
        return;
      }
      if (isSaving) return;
      isSaving = true;
      try {
        await pushRemoteState(roomId, stateCache);
        lastRemoteHash = stateHash(stateCache);
        syncStatus = 'ok';
        lastSyncError = '';
      } catch (e) {
        console.warn('push failed', e);
        syncStatus = 'err';
        lastSyncError = (e && e.message) ? e.message : 'Push fehlgeschlagen';
      } finally {
        isSaving = false;
        window.dispatchEvent(new Event('map-update'));
      }
    }

    function applyPinHoverDom(pid, x, y, forceCreate) {
      if (x == null || y == null) return;
      const pins = document.querySelectorAll('.map-pin.obs-pin-p' + pid);
      if (!pins.length) {
        // Pin not in DOM yet (e.g. first right-click) → one full render to create it
        if (forceCreate !== false) {
          window.dispatchEvent(new Event('map-update'));
        }
        return;
      }
      if (typeof obsSetPinTarget === 'function' && isObs) {
        obsSetPinTarget(pid, { x, y });
      } else {
        pins.forEach(el => {
          el.style.left = (x * 100) + '%';
          el.style.top = (y * 100) + '%';
        });
        if (typeof obsPinTarget !== 'undefined') {
          obsPinTarget[pid] = { x, y };
          if (!obsPinCur[pid]) obsPinCur[pid] = { x, y };
        }
      }
    }

    function broadcastPinHover(pid, hover, meta) {
      if (!realtimeChannel || !roomId) return;
      meta = meta || {};
      try {
        realtimeChannel.send({
          type: 'broadcast',
          event: 'pin-hover',
          payload: {
            playerId: pid,
            x: hover ? hover.x : null,
            y: hover ? hover.y : null,
            visible: hover ? true : false,
            at: Date.now(),
            create: !!meta.create
          }
        });
      } catch (e) {}
    }

    function updatePlayer(id, data, opts) {
      opts = opts || {};
      const state = getState();
      state.players[id] = { ...state.players[id], ...data };
      stateCache = normalizeState(state);
      // Hover-only: no full re-render (prevents animation flicker)
      if (opts.hoverOnly && data.hover) {
        applyPinHoverDom(id, data.hover.x, data.hover.y);
        broadcastPinHover(id, data.hover);
        return stateCache;
      }
      saveState(stateCache);
      return stateCache;
    }

    // ===== URL mode =====
    const params = new URLSearchParams(window.location.search);
    const mode = params.get('mode') || 'home';
    const playerId = mode.startsWith('player') ? parseInt(mode.replace('player', ''), 10) : null;
    // Local player UI: pin hidden until right-click; joker alert blocks movement
    window._pinVisible = playerId ? false : true;
    window._mapPointerInside = false;
    window._alertBlocksMove = false;
    const isObs = mode === 'obs';
    // OBS: unlock audio once (browser autoplay policies)
    if (isObs) {
      const unlock = () => {
        try {
          const ctx = getAudioCtx();
          if (ctx && ctx.state === 'suspended') ctx.resume().catch(() => {});
        } catch (e) {}
        window.removeEventListener('click', unlock);
        window.removeEventListener('keydown', unlock);
      };
      window.addEventListener('click', unlock);
      window.addEventListener('keydown', unlock);
      // try resume periodically while suspended (OBS often blocks until interacted)
      setInterval(() => {
        try {
          const ctx = getAudioCtx();
          if (ctx && ctx.state === 'suspended') ctx.resume().catch(() => {});
        } catch (e) {}
      }, 2000);
    }


    if (isObs && isAuthenticated()) {
      document.body.classList.add('obs-mode');
      document.documentElement.classList.add('obs-mode');
    }

    // ===== Render =====
    const app = document.getElementById('app');
    const obsStage = document.getElementById('obs-stage');

    function roomQuery() {
      return roomId ? '&room=' + encodeURIComponent(roomId) : '';
    }

    function getLoginIdentity() {
      let title = 'KingdomGuessr';
      let subtitle = 'Zugang geschützt';
      let avHtml = '';
      let color = '#888';
      try {
        let st = null;
        try { st = loadLocalCache(); } catch (e) {}
        // Ensure avatar keys use room from URL even before ensureRoom
        try {
          if (!roomId) {
            const rid = (typeof getRoomFromUrl === 'function' && getRoomFromUrl()) || (typeof getLocalRoom === 'function' && getLocalRoom());
            if (rid) roomId = rid;
          }
          loadLocalAvatars();
        } catch (e) {}
        if (playerId >= 1 && playerId <= 4) {
          const p = (st && st.players && st.players[playerId]) ? st.players[playerId] : null;
          title = (p && p.name) ? p.name : ((typeof DEFAULT_NAMES !== 'undefined' && DEFAULT_NAMES[playerId]) ? DEFAULT_NAMES[playerId] : ('Spieler ' + playerId));
          subtitle = '';
          color = (p && p.color) || (typeof DEFAULT_COLORS !== 'undefined' && DEFAULT_COLORS[playerId]) || '#888';
          if (localAvatars[playerId]) {
            avHtml = `<img class="login-av" src="${localAvatars[playerId]}" alt="" style="border-color:${color}">`;
          } else {
            // colored placeholder only if no avatar yet
            avHtml = `<div class="login-av" style="background:${color};border-color:${color}"></div>`;
          }
        } else if (mode === 'admin') {
          title = 'Admin';
          subtitle = 'Kontrollzentrum';
        } else if (mode === 'obs') {
          title = 'OBS Overlay';
          subtitle = 'Browser-Quelle';
        }
      } catch (e) {}
      return { title, subtitle, avHtml, color };
    }

    function renderLogin() {
      document.body.classList.remove('obs-mode');
      document.documentElement.classList.remove('obs-mode');
      const bar = document.getElementById('topBar');
      if (bar) bar.style.display = '';

      const idn = getLoginIdentity();
      const head = (playerId >= 1 && playerId <= 4)
        ? `<div class="login-player-head">${idn.avHtml}<h1>${escapeHtml(idn.title)}</h1></div>`
        : `<h1>${escapeHtml(idn.title)}</h1><p class="subtitle">${escapeHtml(idn.subtitle)}</p>`;
      const pc = idn.color || '#888';

      app.innerHTML = `
        <div class="login-wrap" style="--login-accent:${pc}">
          ${head}
          <div class="login-card login-card-themed">
            <label for="pw">Passwort eingeben</label>
            <input type="password" id="pw" autocomplete="current-password" autofocus
                   placeholder=""
                   oninput="onLoginPwInput()"
                   onkeydown="if(event.key==='Enter'){tryLogin()}">
            <div class="login-error" id="loginError"></div>
            <button class="login-btn" id="loginBtn" onclick="tryLogin()" disabled>Entsperren</button>
          </div>
        </div>
      `;
      obsStage.innerHTML = '';

      setTimeout(() => {
        const inp = document.getElementById('pw');
        if (inp) { inp.focus(); onLoginPwInput(); }
      }, 50);
    }

    window.onLoginPwInput = function() {
      const inp = document.getElementById('pw');
      const btn = document.getElementById('loginBtn');
      if (!inp || !btn) return;
      const ok = inp.value === SITE_PASSWORD;
      btn.disabled = !ok;
      if (ok) btn.classList.add('login-ready');
      else btn.classList.remove('login-ready');
      const err = document.getElementById('loginError');
      if (err && inp.value.length === 0) err.textContent = '';
    };

    window.tryLogin = function() {
      const inp = document.getElementById('pw');
      const err = document.getElementById('loginError');
      if (!inp) return;
      const val = inp.value;
      if (val === SITE_PASSWORD) {
        setAuthenticated();
        if (isObs) {
          document.body.classList.add('obs-mode');
          document.documentElement.classList.add('obs-mode');
        }
        ensureRoom().then(() => render());
      } else {
        if (err) err.textContent = 'Falsches Passwort';
        inp.value = '';
        onLoginPwInput();
        inp.focus();
      }
    };

    function render() {
      if (!isAuthenticated()) {
        renderLogin();
        return;
      }

      const state = getState();
      maybeApplyPendingScores(state);

      if (mode === 'home') {
        const rq = roomQuery();
        app.innerHTML = `
          <h1>KingdomGuessr</h1>
          <p class="subtitle">Wähle deine Rolle</p>
          <div class="card" style="text-align:center; max-width:420px">
            ${roomId ? `<div class="room-badge">Raum-ID: <strong>${escapeHtml(roomId)}</strong><br><span style="opacity:0.7;font-size:0.8em">Alle Links enthalten den Raum</span></div>` : ''}
            <div class="status-line ${syncStatus === 'ok' ? 'ok' : (syncStatus === 'err' ? 'err' : '')}">
              Sync: ${syncStatus === 'ok' ? '✓ Verbunden' : (syncStatus === 'err' ? '⚠ Offline / Fehler' : '…')}
            </div>
            <div class="home-links" style="margin-top:16px">
              <a href="?mode=player1${rq}" class="player">Spieler 1</a>
              <a href="?mode=player2${rq}" class="player">Spieler 2</a>
              <a href="?mode=player3${rq}" class="player">Spieler 3</a>
              <a href="?mode=player4${rq}" class="player">Spieler 4</a>
              <a href="?mode=admin${rq}" class="admin">Kontrollzentrum (Admin)</a>
              <a href="?mode=obs${rq}" class="obs">OBS – Map Overlay</a>
            </div>
          </div>
          <p class="note">
            <strong>Ablauf:</strong> Admin lädt Map hoch → veröffentlicht →
            Spieler klicken ein Feld → „Einloggen“ bestätigen → Admin setzt Lösungspunkt → bei beiden bestätigt: Reveal + Gewinner.
          </p>
        `;
        obsStage.innerHTML = '';
        return;
      }

      if (mode === 'admin') {
        renderAdmin(state);
        return;
      }

      if (playerId >= 1 && playerId <= 4) {
        renderPlayer(state, playerId);
        return;
      }

      if (isObs) {
        app.innerHTML = '';
        renderObs(state);
        return;
      }

      app.innerHTML = `<h1>Ungültiger Modus</h1><p><a href="?" style="color:#ff8e8e">Zur Startseite</a></p>`;
    }

    // ===== Shared map renderer =====
    function isFreeMode(state) {
      return !state.gridSize || state.gridSize <= 0;
    }

    function playerXY(p, gridSize) {
      if (!p) return null;
      if (p.loggedIn && p.confirmed) {
        if (p.confirmed.x != null) return { x: p.confirmed.x, y: p.confirmed.y };
        if (p.confirmed.r != null && gridSize > 0) return cellCenter(p.confirmed.r, p.confirmed.c, gridSize);
      }
      if (p.selected) {
        if (p.selected.x != null) return { x: p.selected.x, y: p.selected.y };
        if (p.selected.r != null && gridSize > 0) return cellCenter(p.selected.r, p.selected.c, gridSize);
      }
      if (p.hover) {
        if (p.hover.x != null) return { x: p.hover.x, y: p.hover.y };
        if (p.hover.r != null && gridSize > 0) return cellCenter(p.hover.r, p.hover.c, gridSize);
      }
      return null;
    }

    function renderMapPin(p, av, modeCls, rankCls, color) {
      const pos = playerXY(p, 0);
      // caller passes absolute x,y
      return '';
    }

    function pinHtml(x, y, av, color, cls, pinPid) {
      if (x == null || y == null) return '';
      const img = av
        ? `<img src="${av}" alt="">`
        : `<div style="width:100%;height:100%;background:${color || '#666'}"></div>`;
      const pidCls = pinPid ? ` obs-pin-p${pinPid}` : '';
      const loginFlash = (pinPid && localLoginPop[pinPid]) ? ' login-flash' : '';
      const aura = (pinPid && localLoginPop[pinPid])
        ? '<div class="login-wave"></div><div class="login-wave w2"></div><div class="login-wave w3"></div>'
        : '';
      return `<div class="map-pin ${cls || ''}${pidCls}${loginFlash}" data-pid="${pinPid || ''}" style="left:${x * 100}%;top:${y * 100}%">
        ${aura}
        <div class="pin-head" style="border-color:${color || '#fff'};box-shadow:0 0 10px 2px ${color || 'transparent'}">${img}</div>
        <div class="pin-point" style="border-top-color:${color || '#fff'}"></div>
      </div>`;
    }

    function buildMapHtml(opts) {
      const state = opts.state;
      const gridSize = 0;
      const free = true;
      const interactive = !!opts.interactive;
      const showBoth = !!opts.showBothPlayers;
      const pid = opts.playerId || null;
      const showSolution = !!opts.showSolution;
      const showOpponent = !!opts.showOpponentConfirmed;
      const mapImg = localMapImage;
      const zoom = state.mapZoom || 1;
      const revealMode = state.phase === 'reveal';

      const p1 = state.players[1];
      const p2 = state.players[2];

      let cells = '';
      let pins = '';
      let topLabels = '';
      let leftLabels = '';

      if (free) {
        const addPin = (who, player, av, show, extraCls) => {
          if (!show || !player) return;
          let x = null, y = null, cls = extraCls || '';
          if (player.loggedIn && player.confirmed && player.confirmed.x != null) {
            x = player.confirmed.x; y = player.confirmed.y;
            cls += ' logged';
            if (revealMode) {
              cls += ' reveal-neutral';
              if (pathAnim && pathAnim.ranks && pathAnim.ranks[who] === 'gold') {
                cls += ' glow-gold';
              }
            }
          } else if (player.selected && player.selected.x != null && !player.loggedIn) {
            x = player.selected.x; y = player.selected.y;
            cls += ' selected';
          } else if (player.hover && player.hover.x != null && !player.loggedIn && !player.selected) {
            x = player.hover.x; y = player.hover.y;
          }
          // During reveal: pin chrome is white/gray; avatar stays; gold winner overrides via CSS
          const pinCol = revealMode ? '#e8e8e8' : player.color;
          if (x != null) pins += pinHtml(x, y, av, pinCol, cls, who);
        };
        const pinVis = playerId ? !!window._pinVisible : true;
        const ids = activePlayerIds(state);
        if (showBoth) {
          ids.forEach(id => addPin(id, state.players[id], localAvatars[id], true));
        } else if (pid) {
          const me = state.players[pid];
          const showOwn = me && (me.loggedIn || (pinVis && (me.selected || me.hover)));
          if (showOwn) addPin(pid, me, localAvatars[pid], true);
          if (showOpponent || state.phase === 'reveal') {
            ids.forEach(id => {
              if (id !== pid) addPin(id, state.players[id], localAvatars[id], true);
            });
          }
        }
      } else {
        const topArr = [];
        for (let c = 0; c < gridSize; c++) topArr.push(`<span>${c + 1}</span>`);
        const leftArr = [];
        for (let r = 0; r < gridSize; r++) leftArr.push(`<span>${LETTERS[r] || (r + 1)}</span>`);
        topLabels = topArr.join('');
        leftLabels = leftArr.join('');

        const p1HoverActive = p1.hover && !p1.loggedIn && !p1.selected;
        const p2HoverActive = p2.hover && !p2.loggedIn && !p2.selected;
        const conf1 = p1.loggedIn && p1.confirmed ? p1.confirmed : null;
        const conf2 = p2.loggedIn && p2.confirmed ? p2.confirmed : null;

        for (let r = 0; r < gridSize; r++) {
          for (let c = 0; c < gridSize; c++) {
            const classes = ['grid-cell'];
            let extra = '';
            let styleExtra = '';

            const onThis1 = conf1 && conf1.r === r && conf1.c === c;
            const onThis2 = conf2 && conf2.r === r && conf2.c === c;
            const bothHere = onThis1 && onThis2;

            if ((showBoth || pid === 1) && p1HoverActive && p1.hover && p1.hover.r === r && p1.hover.c === c) {
              classes.push('hover-p1');
              if (localAvatars[1]) {
                extra += `<img class="avatar-on-cell" src="${localAvatars[1]}" style="border-color:transparent;box-shadow:0 0 14px 4px ${p1.color}" alt="">`;
              }
            }
            if ((showBoth || pid === 2) && p2HoverActive && p2.hover && p2.hover.r === r && p2.hover.c === c) {
              classes.push('hover-p2');
              if (localAvatars[2]) {
                extra += `<img class="avatar-on-cell" src="${localAvatars[2]}" style="border-color:transparent;box-shadow:0 0 14px 4px ${p2.color}" alt="">`;
              }
            }

            if ((showBoth || pid === 1) && p1.selected && p1.selected.r === r && p1.selected.c === c && !p1.loggedIn) {
              classes.push('selected');
              if (localAvatars[1]) {
                extra += `<img class="avatar-on-cell" src="${localAvatars[1]}" style="border-color:transparent;box-shadow:0 0 14px 4px ${p1.color}" alt="">`;
              }
            }
            if ((showBoth || pid === 2) && p2.selected && p2.selected.r === r && p2.selected.c === c && !p2.loggedIn) {
              classes.push('selected');
              if (localAvatars[2]) {
                extra += `<img class="avatar-on-cell" src="${localAvatars[2]}" style="border-color:transparent;box-shadow:0 0 14px 4px ${p2.color}" alt="">`;
              }
            }

            const showConf1 = onThis1 && (showBoth || pid === 1 || (showOpponent && state.phase === 'reveal'));
            const showConf2 = onThis2 && (showBoth || pid === 2 || (showOpponent && state.phase === 'reveal'));
            const frameCls = revealMode ? 'no-frame' : '';

            if (bothHere && (showConf1 || showConf2)) {
              if (!revealMode) {
                classes.push('split-glow');
                styleExtra = `--split-tl:${p1.color}; --split-br:${p2.color};`;
              }
              if (showConf1 && localAvatars[1]) {
                extra += `<img class="avatar-on-cell dual-tl ${frameCls}" src="${localAvatars[1]}" style="color:${p1.color}" alt="">`;
              }
              if (showConf2 && localAvatars[2]) {
                extra += `<img class="avatar-on-cell dual-br ${frameCls}" src="${localAvatars[2]}" style="color:${p2.color}" alt="">`;
              }
              if (pathAnim && pathAnim.ranks) {
                if (pathAnim.ranks[1]) extra += `<div class="rank-dot ${pathAnim.ranks[1]}" style="top:2px;left:2px"></div>`;
                if (pathAnim.ranks[2]) extra += `<div class="rank-dot ${pathAnim.ranks[2]}" style="top:auto;bottom:2px;left:auto;right:2px"></div>`;
              }
              if (pathAnim && pathAnim.pulse && (pathAnim.pulse[1] || pathAnim.pulse[2])) classes.push('pulse');
            } else {
              if (showConf1) {
                if (!revealMode) classes.push('confirmed-p1');
                if (localAvatars[1]) {
                  const glow = (revealMode && pathAnim && pathAnim.ranks && pathAnim.ranks[1] === 'gold') ? 'avatar-glow-gold'
                    : ((revealMode && pathAnim && pathAnim.ranks && pathAnim.ranks[1] === 'silver') ? 'avatar-glow-silver' : '');
                  extra += `<img class="avatar-on-cell ${frameCls} ${glow}" src="${localAvatars[1]}" style="color:${p1.color}" alt="">`;
                }
                if (revealMode && pathAnim && pathAnim.ranks && pathAnim.ranks[1]) {
                  extra += `<div class="rank-dot ${pathAnim.ranks[1]}"></div>`;
                }
                if (pathAnim && pathAnim.pulse && pathAnim.pulse[1]) classes.push('pulse');
                if (localLoginPop[1] && (pid === 1 || showBoth)) classes.push('login-zoom');
              }
              if (showConf2) {
                if (!revealMode) classes.push('confirmed-p2');
                if (localAvatars[2]) {
                  const glow = (revealMode && pathAnim && pathAnim.ranks && pathAnim.ranks[2] === 'gold') ? 'avatar-glow-gold'
                    : ((revealMode && pathAnim && pathAnim.ranks && pathAnim.ranks[2] === 'silver') ? 'avatar-glow-silver' : '');
                  extra += `<img class="avatar-on-cell ${frameCls} ${glow}" src="${localAvatars[2]}" style="color:${p2.color}" alt="">`;
                }
                if (revealMode && pathAnim && pathAnim.ranks && pathAnim.ranks[2]) {
                  extra += `<div class="rank-dot ${pathAnim.ranks[2]}"></div>`;
                }
                if (pathAnim && pathAnim.pulse && pathAnim.pulse[2]) classes.push('pulse');
                if (localLoginPop[2] && (pid === 2 || showBoth)) classes.push('login-zoom');
              }
            }

            if (pid === 1 && p1.spyReveal && conf2 && conf2.r === r && conf2.c === c && localAvatars[2]) {
              extra += `<img class="spy-avatar-only" src="${localAvatars[2]}" alt="">`;
            }
            if (pid === 2 && p2.spyReveal && conf1 && conf1.r === r && conf1.c === c && localAvatars[1]) {
              extra += `<img class="spy-avatar-only" src="${localAvatars[1]}" alt="">`;
            }

            const click = interactive
              ? `onmouseenter="onCellHover(${r},${c})" onclick="onCellClick(${r},${c})"`
              : '';
            cells += `<div class="${classes.join(' ')}" data-r="${r}" data-c="${c}" style="${styleExtra}" ${click}>${extra}</div>`;
          }
        }
      }

      let solDot = '';
      const canShowSol = showSolution && state.phase === 'reveal' && state.rounds[state.revealRound - 1]
        && (!pathAnim || pathAnim.showSolution !== false);
      if (canShowSol && pathAnim && pathAnim.showSolution) {
        const pt = state.rounds[state.revealRound - 1];
        if (pt.x != null && pt.y != null) {
          solDot = `<div class="solution-dot" style="left:${pt.x * 100}%; top:${pt.y * 100}%;"></div>`;
        }
      }
      // Admin: show & drag solution marker while placing (play phase)
      if (mode === 'admin' && opts.placeMode && state.phase === 'play' && state.currentRound >= 1) {
        const pt = state.rounds[state.currentRound - 1];
        if (pt && pt.x != null && pt.y != null) {
          solDot = `<div class="solution-dot editable admin-preview" style="left:${pt.x * 100}%; top:${pt.y * 100}%;"
            onmousedown="startSolDrag(event)"></div>`;
        }
      }

      let pathSvg = '';
      if (pathAnim && pathAnim.linesReady && state.phase === 'reveal' && pathAnim.solPt) {
        const mkAirLine = (target, progress) => {
          if (!target) return '';
          const x1 = pathAnim.solPt.x * 100;
          const y1 = pathAnim.solPt.y * 100;
          const x2 = target.x * 100;
          const y2 = target.y * 100;
          const p = Math.max(0, Math.min(1, progress || 0));
          const cx = x1 + (x2 - x1) * p;
          const cy = y1 + (y2 - y1) * p;
          return `<line x1="${x1}" y1="${y1}" x2="${cx}" y2="${cy}" />`;
        };
        const ids = (pathAnim.playerIds && pathAnim.playerIds.length)
          ? pathAnim.playerIds
          : activePlayerIds(state);
        const lines = ids.map(id => {
          const t = (pathAnim.targets && pathAnim.targets[id]) || (id === 1 ? pathAnim.target1 : (id === 2 ? pathAnim.target2 : null));
          const pr = (pathAnim.progress && pathAnim.progress[id] != null)
            ? pathAnim.progress[id]
            : ((id === 1 ? pathAnim.progress1 : pathAnim.progress2) || 0);
          if (!t) return '';
          const x1 = pathAnim.solPt.x * 100;
          const y1 = pathAnim.solPt.y * 100;
          const x2 = t.x * 100;
          const y2 = t.y * 100;
          const p = Math.max(0, Math.min(1, pr || 0));
          const cx = x1 + (x2 - x1) * p;
          const cy = y1 + (y2 - y1) * p;
          return `<line data-reveal-line="${id}" class="reveal-line-p${id}" x1="${x1}" y1="${y1}" x2="${cx}" y2="${cy}" />`;
        }).join('');
        pathSvg = `
          <svg class="path-svg reveal-lines-svg" viewBox="0 0 100 100" preserveAspectRatio="none">
            ${lines}
          </svg>
        `;
      }

      let rowHintHtml = '';
      if (!free && pid && !showBoth) {
        const hintFor = state.players[pid].rowHint;
        if (hintFor) {
          if (hintFor.type === 'r') {
            const top = (hintFor.index / gridSize) * 100;
            const height = (1 / gridSize) * 100;
            rowHintHtml += `<div class="row-hint-band" style="left:0;width:100%;top:${top}%;height:${height}%;"></div>`;
          } else if (hintFor.type === 'c') {
            const left = (hintFor.index / gridSize) * 100;
            const width = (1 / gridSize) * 100;
            rowHintHtml += `<div class="row-hint-band" style="top:0;height:100%;left:${left}%;width:${width}%;"></div>`;
          }
        }
      }

      const placeMode = opts.placeMode;
      const freeInteractive = free && interactive;
      const placeClick = placeMode
        ? `onclick="onMapPlace(event)" onmousedown="onSolStageDown(event)" style="cursor:crosshair"`
        : (freeInteractive
          ? `onclick="onFreeMapClick(event)" onmousemove="onFreeMapMove(event)" oncontextmenu="onPinToggle(event);return false;" style="cursor:crosshair"`
          : '');
      const leaveHandler = interactive ? `onmouseleave="onMapLeave()"` : '';
      const hideLabels = !!opts.hideLabels;
      const showLabels = !free && !hideLabels;
      const borderOn = state.mapBorderEnabled !== false;
      const borderCol = borderOn ? (state.mapBorderColor || '#e53935') : 'transparent';
      const borderW = borderOn ? '4px' : '0';

      const alertHtml = maybeShowJokerAlert(state);

      let spyPickHtml = '';
      if (window._spyPickPending && window._spyPickPending.targets && playerId) {
        const tgs = window._spyPickPending.targets;
        const btns = tgs.map(id => {
          const pl = state.players[id];
          const av = localAvatars[id];
          const avH = av ? `<img src="${av}" alt="">` : `<div class="spy-pick-av" style="background:${pl.color||'#555'}"></div>`;
          return `<button type="button" class="spy-pick-btn" onclick="pickSpyTarget(${id})">${avH}<span>${escapeHtml(pl.name||('Spieler '+id))}</span></button>`;
        }).join('');
        spyPickHtml = `<div class="spy-pick-box"><h3>Spion – Ziel wählen</h3><div class="spy-pick-row">${btns}</div>
          <button type="button" class="btn btn-secondary btn-sm" style="margin-top:10px" onclick="cancelSpyPick()">Abbrechen</button></div>`;
      }

      // Result box after reveal lines finished
      let resultHtml = '';
      const resultGloballyClosed = !!(state._resultClosed);
      const resultLocallyClosed = !!(window._localResultClosedRound && window._localResultClosedRound === state.revealRound);
      if (pathAnim && pathAnim.resultText && state.phase === 'reveal' && !resultGloballyClosed && !resultLocallyClosed) {
        const canClose = (mode === 'admin' || isObs);
        const showLocalX = !!(pid || (mode !== 'admin' && !isObs));
        const lines = pathAnim.resultLines || [];
        // Static ranking table – no counting animation here
        const placeCls = ['p1', 'p2', 'p3', 'p4'];
        const placeLabel = ['1.', '2.', '3.', '4.'];
        const rowsHtml = lines.map((L, i) => {
          const neg = L.pts < 0;
          const cls = neg ? 'rr-pts neg' : 'rr-pts pos';
          const abs = Math.abs(Math.round(L.pts));
          const shownStr = neg ? ('−' + abs) : ('+' + abs);
          const av = localAvatars[L.pid];
          const avHtml = av
            ? `<img class="rr-av" src="${av}" alt="">`
            : `<div class="rr-av" style="background:${(state.players[L.pid]&&state.players[L.pid].color)||'#444'}"></div>`;
          return `<div class="rr-row" data-pid="${L.pid}">
            <span class="rr-place ${placeCls[i] || 'p4'}">${placeLabel[i] || ((i+1)+'.')}</span>
            ${avHtml}
            <span class="rr-name">${escapeHtml(L.name)}${L.x2tag || ''}</span>
            <span class="rr-meta">${L.meters} m → <span class="${cls}">${shownStr}</span> P.</span>
          </div>`;
        }).join('');
        const winnerBar = pathAnim.resultIsTie
          ? `<div class="rr-winner-bar"><span class="rr-trophy">🤝</span></div>`
          : `<div class="rr-winner-bar"><span class="rr-trophy">🏆</span></div>`;
        resultHtml = `<div class="reveal-result-box" id="reveal-result-box">
          ${showLocalX ? `<button type="button" class="rr-local-close" onclick="dismissResultLocal()" title="Schließen">×</button>` : ''}
          ${winnerBar}
          <div class="rr-table">${rowsHtml}</div>
          ${canClose ? `<button class="btn btn-secondary btn-sm rr-close" onclick="closeRevealResult()">Schließen</button>` : ''}
        </div>`;
      }

      // Joker effect overlays – visible until the activator logs in
      let effectHtml = '';
      const addSpy = (sr, extraCls) => {
        if (!sr || !sr.r) return '';
        const cls = extraCls ? (' ' + extraCls) : '';
        return `<div class="spy-radius${cls}" style="left:${sr.cx*100}%;top:${sr.cy*100}%;width:${sr.r*200}%;height:${sr.r*200}%;"><div class="sonar-sweep"></div><div class="sonar-ring"></div></div>`;
      };
      const addHalf = (side, extraCls) => {
        if (!side) return '';
        const cls = extraCls ? (' ' + extraCls) : '';
        return `<div class="half-cover ${side}${cls}"></div>`;
      };

      if (pid && !showBoth) {
        // Player room: solid effect until login
        const me = state.players[pid];
        if (!me.loggedIn) {
          if (me.spyRadius) effectHtml += addSpy(me.spyRadius);
          if (me.halfCover) effectHtml += addHalf(me.halfCover);
        }
      } else if (showBoth || isObs) {
        // OBS/Admin: only after joker alert finished (~3.8s), then soft pulse until login
        const msg = state.lastObsJokerMsg;
        const alertDone = !msg || !msg.at || (Date.now() - msg.at >= 3800);
        if (!alertDone && msg && msg.at) {
          // schedule show after alert ends
          const wait = Math.max(50, 3800 - (Date.now() - msg.at));
          if (window._obsFxWaitFor !== msg.at) {
            window._obsFxWaitFor = msg.at;
            setTimeout(() => { try { render(); } catch (e) {} }, wait + 30);
          }
        } else {
          // All players 1–4: show spy/half FX until the activator logs in
          const idsFx = (typeof activePlayerIds === 'function') ? activePlayerIds(state) : [1, 2, 3, 4];
          for (const id of idsFx) {
            const pl = state.players[id];
            if (!pl || pl.loggedIn) continue;
            if (pl.spyRadius) effectHtml += addSpy(pl.spyRadius, 'joker-fx-pulse');
            if (pl.halfCover) effectHtml += addHalf(pl.halfCover, 'joker-fx-pulse');
          }
        }
      }

      return `
        <div class="map-wrap" style="--p1-color:${p1.color}; --p2-color:${p2.color}; --map-zoom:${zoom}; --map-border:${borderCol}; --gutter-left:${showLabels ? '28px' : '0'}; --gutter-top:${showLabels ? '22px' : '0'}" ${leaveHandler}>
          ${showLabels ? `<div class="map-labels-top" style="grid-template-columns: repeat(${gridSize}, 1fr)">${topLabels}</div>` : '<div class="map-labels-top"></div>'}
          <div class="map-body">
            ${showLabels ? `<div class="map-labels-left">${leftLabels}</div>` : '<div class="map-labels-left"></div>'}
            <div class="map-stage" style="border-width:${borderW}; border-color:${borderCol}" ${placeClick}>
              <div class="map-clip">
                ${mapImg
                  ? `<img class="map-img" src="${mapImg}" alt="Map" draggable="false">`
                  : `<div class="map-placeholder">Keine Map geladen</div>`}
                ${rowHintHtml}
                ${!free ? `<div class="grid-overlay ${interactive ? 'interactive' : ''}"
                     style="grid-template-columns: repeat(${gridSize}, 1fr); grid-template-rows: repeat(${gridSize}, 1fr)">
                  ${cells}
                </div>` : ''}
                ${effectHtml || ''}
                ${alertHtml}
                ${(mode !== 'admin' && !isObs && state.categoryShow && state.categoryShow.active) ? '<div class="map-wait-overlay">Bitte warten</div>' : ''}
                ${(mode !== 'admin' && needsExtraImageWait(state) && !(state.categoryShow && state.categoryShow.active)) ? '<div class="map-black-overlay"></div>' : ''}
                ${(state.finalImageShow && state.finalImageShow.active && state.finalImageShow.image) ? `<img class="map-final-image" src="${state.finalImageShow.image}" alt="">` : ''}
              </div>
              ${pathSvg}
              ${solDot}
              ${pins}
              ${resultHtml}${spyPickHtml}
            </div>
          </div>
        </div>
      `;
    }

    function pointToCell(x, y, gridSize) {
      // x,y in 0..1 → cell indices
      const c = Math.min(gridSize - 1, Math.max(0, Math.floor(x * gridSize)));
      const r = Math.min(gridSize - 1, Math.max(0, Math.floor(y * gridSize)));
      return { r, c };
    }

    function cellCenter(r, c, gridSize) {
      return {
        x: (c + 0.5) / gridSize,
        y: (r + 0.5) / gridSize
      };
    }

    function dist(a, b) {
      return Math.hypot(a.x - b.x, a.y - b.y);
    }

    /** Map a cell into a target gridSize view (legacy helper; grids are global now) */
    function mapCellToView(player, cell, viewSize) {
      if (!cell) return null;
      return { r: cell.r, c: cell.c };
    }

    // ===== Admin =====
    function renderAdmin(state) {
      ensureRevealAnim(state);
      const pc = getPlayerCount(state);
      const mapImg = localMapImage;
      const round = state.currentRound;
      const hasPoint = state.rounds[round - 1] && state.rounds[round - 1].x != null;
      const gSize = 0;
      const zoomPct = Math.round((state.mapZoom || 1) * 100);

      let roundBtns = `<button class="round-btn ${round === 0 ? 'active' : ''}" onclick="setCurrentRound(0)">0</button>`;
      for (let i = 1; i <= 15; i++) {
        const has = state.rounds[i - 1] && state.rounds[i - 1].x != null;
        roundBtns += `<button class="round-btn ${i === round ? 'active' : ''} ${has ? 'has-point' : ''}"
          onclick="setCurrentRound(${i})">${i}</button>`;
      }

      const cats = state.categories || [{name:'',icon:null},{name:'',icon:null},{name:'',icon:null}];
      const catBlock = (ci, label) => {
        const c = cats[ci] || { name: '', icon: null };
        return `<div class="admin-cat-block">
          <h3>Kategorie ${ci + 1} · ${label}</h3>
          <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
            <label class="btn btn-secondary btn-sm" style="cursor:pointer">Icon
              <input type="file" accept="image/*" style="display:none" onchange="onCategoryIcon(${ci}, this)">
            </label>
            ${c.icon ? `<img src="${c.icon}" style="width:36px;height:36px;border-radius:50%;object-fit:cover" alt="">` : ''}
            ${c.icon ? `<button class="btn btn-secondary btn-sm" onclick="clearCategoryIcon(${ci})">×</button>` : ''}
            <input type="text" style="flex:1;min-width:160px" value="${escapeHtml(c.name || '')}"
              placeholder="Kategorie-Name" onchange="setCategoryName(${ci}, this.value)">
          </div>
        </div>`;
      };
      let questionRows = '';
      state.rounds.forEach((r, idx) => {
        if (idx === 0) questionRows += catBlock(0, 'Runden 1–5');
        if (idx === 5) questionRows += catBlock(1, 'Runden 6–10');
        if (idx === 10) questionRows += catBlock(2, 'Runden 11–15');
        const isFinal = idx >= 10;
        questionRows += `
        <div class="question-row" style="${isFinal ? 'flex-wrap:wrap' : ''}">
          <span>${idx + 1}</span>
          <label class="btn btn-secondary btn-sm" style="padding:6px 8px;cursor:pointer;flex-shrink:0" title="Fragen-Icon">
            🖼
            <input type="file" accept="image/*" style="display:none" onchange="onQuestionImg(${idx + 1}, this)">
          </label>
          ${r.questionImg ? `<img src="${r.questionImg}" style="width:28px;height:28px;border-radius:50%;object-fit:cover;flex-shrink:0" alt="">` : ''}
          <input type="text" value="${escapeHtml(r.question || '')}"
                 placeholder="Frage für Runde ${idx + 1}"
                 onchange="setRoundQuestion(${idx + 1}, this.value)">
          ${r.questionImg ? `<button class="btn btn-secondary btn-sm" style="padding:4px 8px" onclick="clearQuestionImg(${idx + 1})">×</button>` : ''}
          ${isFinal ? `
            <span style="width:100%;height:0"></span>
            <label class="btn btn-secondary btn-sm" style="cursor:pointer" title="Vollbild 5s">Extra-Bild
              <input type="file" accept="image/*" style="display:none" onchange="onRoundExtraImage(${idx + 1}, this)">
            </label>
            ${r.extraImage ? `<img src="${r.extraImage}" style="width:36px;height:36px;object-fit:cover;border-radius:6px" alt="">` : ''}
            ${r.extraImage ? `<button class="btn btn-secondary btn-sm" onclick="clearRoundExtraImage(${idx + 1})">×</button>` : ''}
            <button class="btn btn-primary btn-sm" onclick="showFinalImage(${idx + 1})"
              ${r.extraImage && state.currentRound === (idx + 1) ? '' : 'disabled'}>Bild anzeigen</button>
            <span style="font-size:0.75rem;opacity:0.7">${r.extraImageShown ? '✓ gezeigt' : ''}</span>
          ` : ''}
        </div>`;
      });

      app.innerHTML = `
        <h1>KingdomGuessr – Admin</h1>
        <div style="margin:8px 0 16px;display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap">
          <span style="font-weight:700">Spieleranzahl:</span>
          <button type="button" class="btn ${pc===2?'btn-primary':'btn-secondary'} btn-sm" onclick="setPlayerCount(2)">2 Spieler</button>
          <button type="button" class="btn ${pc===4?'btn-primary':'btn-secondary'} btn-sm" onclick="setPlayerCount(4)">4 Spieler</button>
        </div>
        <p class="subtitle">Map · ${getPlayerCount(state)} Spieler · 15 Runden</p>
        <div class="status-line ${syncStatus === 'ok' ? 'ok' : (syncStatus === 'err' ? 'err' : '')}">
          Sync: ${syncStatus === 'ok' ? '✓ Verbunden' : (syncStatus === 'err' ? '⚠ Offline' : '…')}
          · Map: ${state.mapPublished ? '✓ veröffentlicht' : 'nicht veröffentlicht'}
          · Raster: ${gSize}×${gSize} · Runde: ${round}/15 · Phase: ${state.phase === 'reveal' ? 'Reveal' : 'Spiel'}
          ${syncStatus === 'err' && lastSyncError ? '<br><span style="color:#ff8a80;font-size:0.85em">' + escapeHtml(lastSyncError) + '</span>' : ''}
        </div>

        <div class="admin-layout">
          <div class="section">
            <h2>Map hochladen (1000×1000 empfohlen)</h2>
            <div class="map-upload-zone">
              <input type="file" accept="image/*" onchange="onMapUpload(this)">
              ${mapImg ? '✓ Map geladen – klicken zum Ersetzen' : 'Klicken oder Bild hier ablegen'}
            </div>
            <div class="zoom-row">

      const jokerSide = JOKER_KEYS.map(k => {

      }).join('');

      const interactive = mapReady && state.phase === 'play' && !p.loggedIn && round >= 1 && !locked;

        ? (!pathAnim || pathAnim.showOpponent)
        : false;

      app.innerHTML = `
        <div class="volume-control">

          <div class="player-game-panel">

            <div class="map-col">
              ${buildMapHtml({
                state,

                interactive,
                playerId: pid,

              })}
            </div>
            <div class="player-actions">
              <button class="btn btn-green ${p.selected && !p.loggedIn && state.phase === 'play' && round >= 1 && !locked ? 'login-ready' : ''}"
                style="min-width:220px;padding:16px 28px;font-size:1.15rem" onclick="doLogin()"
                ${p.selected && !p.loggedIn && state.phase === 'play' && round >= 1 && !locked ? '' : 'disabled'}>

    window.onLoginVol = function(val) {
      const n = parseInt(val, 10);
      if (isNaN(n)) return;
      setLoginVolume(n / 100);
      const span = document.querySelector('.volume-control span');
      if (span) span.textContent = n + '%';
    };


    window.applySpyTarget = function(fromPid, targetId) {
      const state = getState();
      const p = state.players[fromPid];
      const oppP = state.players[targetId];
      if (!p || !oppP || !oppP.confirmed || oppP.confirmed.x == null) return;
      if (!p.jokers) p.jokers = { spy: true, half: true, x2: true };
      if (!p.jokers.spy) return;
      p.spyTarget = targetId;
      const rad = 0.14 + Math.random() * 0.08;
      const angle = Math.random() * Math.PI * 2;
      const off = rad * (0.4 + Math.random() * 0.4);
      const ox = Math.cos(angle) * off;
      const oy = Math.sin(angle) * off;
      p.spyRadius = {
        cx: Math.max(0.04, Math.min(0.96, oppP.confirmed.x + ox)),
        cy: Math.max(0.04, Math.min(0.96, oppP.confirmed.y + oy)),
        r: rad
      };
      p.jokers.spy = false;
      state.jokerRoundUsed = { round: state.currentRound, playerId: fromPid, type: 'spy' };
      state.lastObsJokerMsg = {
        playerName: p.name,
        jokerName: JOKER_META.spy.name,
        jokerType: 'spy',
        playerId: fromPid,
        at: Date.now()
      };
      window._spyPickPending = null;
      saveState(state);
      playShineSound();
      render();
    };
    window.pickSpyTarget = function(targetId) {
      if (!playerId || !window._spyPickPending) return;
      window.applySpyTarget(playerId, Number(targetId));
    };
    window.cancelSpyPick = function() {
      window._spyPickPending = null;
      render();
    };

    window.useJoker = function(type) {
      if (!playerId) return;
      const state = getState();
      if (isPlayLocked(state)) return;
      const p = state.players[playerId];
      const oppId = playerId === 1 ? 2 : 1;
      const opp = state.players[oppId];
      if (!p.jokers) p.jokers = { spy: true, half: true, x2: true };
      if (!p.jokers[type] || p.loggedIn || state.phase !== 'play' || state.currentRound < 1) return;
      if (state.jokerRoundUsed && state.jokerRoundUsed.round === state.currentRound) {
        alert('In dieser Runde wurde bereits ein Joker eingesetzt.');
        return;
      }

      if (type === 'spy') {
        const ids = activePlayerIds(state).filter(id => id !== playerId);
        const logged = ids.filter(id => {
          const o = state.players[id];
          return o && o.loggedIn && o.confirmed && o.confirmed.x != null;
        });
        if (!logged.length) {
          alert('Kein anderer Spieler hat bisher eingeloggt.');
          return;
        }
        if (logged.length === 1) {
          applySpyTarget(playerId, logged[0]);
          return;
        }
        // Show on-map picker instead of prompt
        window._spyPickPending = { type: 'spy', targets: logged };
        render();
        return;
      } else if (type === 'half') {
        const pt = state.rounds[state.currentRound - 1];
        if (!pt || pt.x == null) {
          alert('Noch kein Lösungspunkt für diese Runde gesetzt.');
          return;
        }
        // Cover the half that does NOT contain the solution
        const options = [];
        if (pt.x >= 0.5) options.push('left'); else options.push('right');
        if (pt.y >= 0.5) options.push('top'); else options.push('bottom');
        p.halfCover = options[Math.floor(Math.random() * options.length)];
      } else if (type === 'x2') {
        p.x2Active = true;
      }

      p.jokers[type] = false;
      state.jokerRoundUsed = { round: state.currentRound, playerId, type };
      state.lastObsJokerMsg = {
        playerName: p.name,
        jokerName: JOKER_META[type].name,
        jokerType: type,
        playerId: playerId,
        at: Date.now()
      };
      saveState(state);
      playShineSound();
      render();
    };

    function playShineSound() {
      const ctx = getAudioCtx();
      if (!ctx || loginVolume <= 0) return;
      try {
        const now = ctx.currentTime;
        const master = ctx.createGain();
        master.gain.setValueAtTime(0, now);
        master.gain.linearRampToValueAtTime(loginVolume * 0.28, now + 0.02);
        master.gain.exponentialRampToValueAtTime(0.001, now + 0.7);
        master.connect(ctx.destination);
        // Soft low pad
        const o1 = ctx.createOscillator();
        o1.type = 'sine';
        o1.frequency.setValueAtTime(220, now);
        o1.frequency.exponentialRampToValueAtTime(330, now + 0.35);
        const o2 = ctx.createOscillator();
        o2.type = 'triangle';
        o2.frequency.setValueAtTime(165, now);
        o2.frequency.exponentialRampToValueAtTime(247, now + 0.4);
        const g2 = ctx.createGain();
        g2.gain.value = 0.45;
        o1.connect(master);
        o2.connect(g2); g2.connect(master);
        o1.start(now); o1.stop(now + 0.7);
        o2.start(now); o2.stop(now + 0.7);
      } catch (e) {}
    }

    let lastJokerAlertAt = 0;


    function renderPlayerScoreBar(state, selfPid) {
      const s = state.scores || { 1: 0, 2: 0, 3: 0, 4: 0 };
      const anim = (scoreAnim && scoreAnim.animScores) ? scoreAnim.animScores
        : ((pathAnim && pathAnim.animScores) ? pathAnim.animScores : null);
      const ids = activePlayerIds(state).slice();
      ids.sort((a, b) => {
        const sa = anim && anim[a] != null ? anim[a] : (s[a] || 0);
        const sb = anim && anim[b] != null ? anim[b] : (s[b] || 0);
        const da = sb - sa;
        if (da !== 0) return da;
        return a - b;
      });
      const entries = ids.map(id => {
        const p = state.players[id] || emptyPlayer(id);
        const col = p.color || DEFAULT_COLORS[id] || '#fff';
        const val = anim && anim[id] != null ? Math.round(anim[id]) : (s[id] || 0);
        const active = (scoreAnim && scoreAnim.animActive === id) || (pathAnim && pathAnim.animActive === id);
        return `<div class="ps-entry${active ? ' ps-counting' : ''}" data-pid="${id}">
          ${localAvatars[id] ? `<img class="ps-av" src="${localAvatars[id]}" alt="">` : `<div class="ps-av"></div>`}
          <span class="ps-name">${escapeHtml(p.name || ('Spieler ' + id))}</span>
          <span class="ps-score" style="color:${col}">${val}</span>
        </div>`;
      }).join('');
      return `<div class="player-score-bar">${entries}</div>`;
    }

    function renderAdminScores(state) {
      const s = state.scores || { 1: 0, 2: 0 };
      const mk = (pid) => {
        const p = state.players[pid];
        const vals = [1,2,3,4,5];
        return `<div class="score-admin-box">
          <div class="sc-name">${escapeHtml(p.name)}</div>
          <div class="sc-val" style="color:${p.color}">${s[pid] || 0}</div>

          </div>
          <button class="btn btn-red btn-sm" style="margin-top:8px;width:100%" onclick="resetPlayerScore(${pid})">Punkte Reset</button>
        </div>`;
      };
      return `<div class="score-admin-row">${activePlayerIds(state).map(mk).join('')}</div>`;
    }

    window.resetPlayerScore = function(pid) {
      const state = getState();
      if (!state.scores) state.scores = { 1: 0, 2: 0, 3: 0, 4: 0 };
      state.scores[pid] = 0;
      state._scorePop = { pid, at: Date.now() };
      saveState(state);
      render();
    };

    window.addScore = function(pid, delta) {
      const state = getState();
      if (!state.scores) state.scores = { 1: 0, 2: 0, 3: 0, 4: 0 };
      state.scores[pid] = (state.scores[pid] || 0) + delta;
      state._scorePop = { pid, at: Date.now() };
      saveState(state);
      render();
    };

    window.setMapBorderColor = function(c) {
      const state = getState();
      state.mapBorderColor = c;
      saveState(state);
      render();

    function maybeShowJokerAlert(state) {
      const msg = state.lastObsJokerMsg;
      if (!msg || !msg.at) return '';
      // Activator never sees the alert
      if (playerId && msg.playerId === playerId) return '';

      const age = Date.now() - msg.at;
      if (age > 3800) {
        // After fade-out: unlock movement (pin stays hidden until right-click)
        if (window._alertBlocksMove && window._alertUnlockFor === msg.at) {
          window._alertBlocksMove = false;
        }
        return '';
      }

      // First sight of this alert: block movement + hide pin (players only)
      if (msg.at !== lastJokerAlertAt) {
        lastJokerAlertAt = msg.at;
        playShineSound();
        if (playerId) {
          window._alertBlocksMove = true;
          window._pinVisible = false;
          window._alertUnlockFor = msg.at;
          try {
            const st = getState();
            const pp = st.players[playerId];
            if (pp && !pp.loggedIn) {
              updatePlayer(playerId, { hover: null, selected: null });
            }
          } catch (e) {}
        }
        // schedule re-renders for fade + unlock
        setTimeout(() => render(), 3000);
        setTimeout(() => {
          if (window._alertUnlockFor === msg.at) window._alertBlocksMove = false;
          render();
        }, 3900);
      }

      const fading = age >= 3000;
      const colors = { half: '#1565c0', spy: '#c62828', x2: '#2e7d32' };
      const bg = colors[msg.jokerType] || '#333';
      const av = msg.playerId ? localAvatars[msg.playerId] : null;
      const desc = (msg.jokerType && JOKER_META[msg.jokerType]) ? JOKER_META[msg.jokerType].desc : '';
      return `
        <div class="joker-alert" style="background:linear-gradient(135deg, ${bg}, ${bg}dd); box-shadow:0 0 0 2px ${bg}, 0 0 28px 8px ${bg}99, 0 8px 24px rgba(0,0,0,0.45); flex-direction:column; align-items:stretch; transition: opacity 0.8s ease; opacity:${fading ? 0 : 1};">
          <div style="display:flex;align-items:center;gap:12px;">
            <div class="ja-icon ${msg.jokerType ? JOKER_META[msg.jokerType].cls : ''}">${msg.jokerType ? JOKER_SVG[msg.jokerType] : ''}</div>
            <div class="ja-body">
              <div class="ja-title">${escapeHtml(msg.playerName)} · ${escapeHtml(msg.jokerName)}</div>
              <div class="ja-desc">${escapeHtml(desc)}</div>
            </div>
            ${av ? `<img class="ja-av" src="${av}" alt="">` : ''}
          </div>
        </div>
      `;
    }

    // ===== OBS =====
    let obsJokerEditOpen = false;
    let obsQuestionEditOpen = false;
    let obsMapEditOpen = false;
    let obsScoreEditOpen = false;
    let obsNameEditOpen = false;
    let obsLampEditOpen = false;
    let obsCatEditOpen = false;
    let obsTimerEditOpen = false;
    let obsWaitEditOpen = false;
    let obsRound0EditOpen = false;

    /** Start reveal animation locally when phase flips to reveal (all clients) */
    function ensureRevealAnim(state) {
      if (state.phase !== 'reveal' || !state.revealRound) return;
      if (pathAnim && pathAnim.revealRound === state.revealRound) return;
      if (!allActiveLoggedIn(state)) return;
      const pt = state.rounds[state.revealRound - 1];
      if (!pt || pt.x == null) return;

      const ids = activePlayerIds(state);
      const targets = {};
      const distances = {};
      ids.forEach(id => {
        const p = state.players[id];
        if (p.confirmed && p.confirmed.x != null) {
          targets[id] = { x: p.confirmed.x, y: p.confirmed.y };
        } else if (p.confirmed) {
          const gSize = state.gridSize || 8;
          targets[id] = cellCenter(p.confirmed.r, p.confirmed.c, gSize);
        }
        distances[id] = targets[id] ? dist(targets[id], { x: pt.x, y: pt.y }) : 1;
      });

      stopPathAnim();
      const progress = {};
      const arrived = {};
      ids.forEach(id => { progress[id] = 0; arrived[id] = false; });
      pathAnim = {
        linesReady: false,
        showOpponent: false,
        showSolution: false,
        targets: targets,
        progress: progress,
        ranks: {},
        pulse: {},
        solPt: { x: pt.x, y: pt.y },
        distances: distances,
        arrived: arrived,
        timer: null,
        revealRound: state.revealRound,
        playerIds: ids.slice()
      };
      // back-compat aliases for older SVG code paths
      pathAnim.target1 = targets[1] || null;
      pathAnim.target2 = targets[2] || null;
      pathAnim.progress1 = 0;
      pathAnim.progress2 = 0;
      window.dispatchEvent(new Event('map-update'));

      setTimeout(() => {
        if (!pathAnim || pathAnim.revealRound !== state.revealRound) return;
        pathAnim.showOpponent = true;
        window.dispatchEvent(new Event('map-update'));
      }, 400);

      setTimeout(() => {
        if (!pathAnim || pathAnim.revealRound !== state.revealRound) return;
        pathAnim.showSolution = true;
        playGameSfx('solution');
        window.dispatchEvent(new Event('map-update'));
      }, 2000);

      setTimeout(() => {
        if (!pathAnim || pathAnim.revealRound !== state.revealRound) return;
        pathAnim.linesReady = true;
        window.dispatchEvent(new Event('map-update')); // one full render to create SVG lines
        const SPEED = 0.018;
        const ticks = {};
        ids.forEach(id => { ticks[id] = Math.max(8, Math.ceil((distances[id] || 0.1) / SPEED) || 8); });
        let step = 0;
        let arrivalOrder = [];
        pathAnim.timer = setInterval(() => {
          if (!pathAnim) return;
          step++;
          ids.forEach(id => {
            pathAnim.progress[id] = Math.min(1, step / ticks[id]);
            if (id === 1) pathAnim.progress1 = pathAnim.progress[id];
            if (id === 2) pathAnim.progress2 = pathAnim.progress[id];
            if (!pathAnim.arrived[id] && pathAnim.progress[id] >= 1) {
              pathAnim.arrived[id] = true;
              pathAnim.pulse[id] = true;
              arrivalOrder.push(id);
              if (arrivalOrder.length === 1) {
                pathAnim.ranks[id] = 'gold';
                playGameSfx('line1');
                // Gold immediately on first contact (don't wait for result table)
                try {
                  document.querySelectorAll('.map-pin.obs-pin-p' + id + ', .map-pin[data-pid="' + id + '"]').forEach(el => {
                    el.classList.add('reveal-neutral', 'glow-gold');
                  });
                } catch (e) {}
              } else if (arrivalOrder.length === 2) {
                playGameSfx('line2');
              }
            }
          });

          // Soft update lines only – avoids full re-render flicker
          window.dispatchEvent(new CustomEvent('map-update', { detail: { soft: 'reveal-lines' } }));

          if (ids.every(id => pathAnim.arrived[id])) {
            clearInterval(pathAnim.timer);
            pathAnim.timer = null;

            // Only the closest pin gets gold – others keep normal look
            const sorted = ids.slice().sort((a, b) => distances[a] - distances[b]);
            const best = distances[sorted[0]];
            const winners = sorted.filter(id => Math.abs(distances[id] - best) < 0.0005);
            let winner = (winners.length === 1) ? winners[0] : 'tie';
            pathAnim.ranks = {};
            if (winners.length === 1) pathAnim.ranks[winners[0]] = 'gold';
            // ties: no gold (or all gold? user said only first – on tie none exclusive)
            else winners.forEach(id => { pathAnim.ranks[id] = 'gold'; });

            const toMeters = (d) => Math.min(100, Math.round(d * 1000) / 10);
            const entries = ids.map(id => {
              const m = toMeters(distances[id]);
              let base = Math.max(0, Math.round(100 - m));
              const p = state.players[id];
              const x2 = !!(p.x2Active || (state.jokerRoundUsed && state.jokerRoundUsed.round === state.revealRound && state.jokerRoundUsed.playerId === id && state.jokerRoundUsed.type === 'x2'));
              let pts = base;
              if (x2) {
                if (winners.length === 1 && winners[0] === id) pts = base * 2;
                else if (winners.length === 1 && winners[0] !== id) pts = -Math.round(base / 2);
              }
              return { name: p.name || ('Spieler ' + id), meters: m, pts, pid: id, x2tag: x2 ? ' (×2)' : '' };
            }).sort((a, b) => a.meters - b.meters);

            pathAnim.resultIsTie = (winner === 'tie');
            pathAnim.resultWinnerName = (winner === 'tie')
              ? 'Unentschieden'
              : (state.players[winner].name || ('Spieler ' + winner));
            pathAnim.resultText = pathAnim.resultWinnerName; // flag for showing box

            if (!pathAnim._sfxResult) { pathAnim._sfxResult = true; playGameSfx('result'); }
            // Static final values in result table (no count-up on the board)
            pathAnim.resultLines = entries.map(e => ({
              name: e.name, meters: e.meters, pts: e.pts, displayPts: e.pts, pid: e.pid, x2tag: e.x2tag
            }));

            {
              const st = getState();
              if (!st.scores) st.scores = { 1: 0, 2: 0, 3: 0, 4: 0 };
              const ptsById = {};
              entries.forEach(e => { ptsById[e.pid] = e.pts; });
              const order = ids.slice().sort((a, b) => a - b);

              // OBS (preferred) or Admin writes scores once per revealRound
              const canWrite = isObs || mode === 'admin';
              if (canWrite && st.scoreAwardedRound !== state.revealRound) {
                st.scoreAwardedRound = state.revealRound; // claim first
                const before = {};
                order.forEach(id => { before[id] = st.scores[id] || 0; });
                order.forEach(id => {
                  st.scores[id] = (before[id] || 0) + (ptsById[id] || 0);
                });
                st.winner = winner;
                if (!st.roundWinners) st.roundWinners = {};
                st.roundWinners[state.revealRound] = winner;
                ids.forEach(id => { if (st.players[id]) st.players[id].x2Active = false; });
                st._pendingScoreAward = {
                  round: state.revealRound, ptsById, before, order, at: Date.now()
                };
                saveState(st);
                startScoreCountAnimation(st._pendingScoreAward);
              } else if (st._pendingScoreAward && st._pendingScoreAward.round === state.revealRound) {
                startScoreCountAnimation(st._pendingScoreAward);
              } else if (canWrite && !st.winner) {
                st.winner = winner;
                saveState(st);
              }
            }
            window.dispatchEvent(new Event('map-update'));
            setTimeout(() => {
              if (pathAnim) {
                pathAnim.pulse = {};
                window.dispatchEvent(new Event('map-update'));
              }
            }, 900);
          }
        }, 50);
      }, 2600);
    }

    // ===== Score count animation (P1→P4, 3s each) – independent of pathAnim =====
    let _scoreAnimKey = null;
    let _scoreAnimRaf = null;
    let scoreAnim = null; // { animScores, animBonus, animActive, ... }

    function startScoreCountAnimation(pend) {
      if (!pend || !pend.ptsById || !pend.order) return;
      const key = String(pend.round) + ':' + String(pend.at || 0);
      if (_scoreAnimKey === key) return;
      _scoreAnimKey = key;
      if (_scoreAnimRaf) cancelAnimationFrame(_scoreAnimRaf);

      const order = pend.order.slice();
      const ptsById = pend.ptsById;
      const before = pend.before || {};
      scoreAnim = {
        animScores: {},
        animBonus: {},
        animActive: null,
        round: pend.round
      };
      // also mirror onto pathAnim if present (for any legacy readers)
      if (pathAnim) {
        pathAnim.animScores = scoreAnim.animScores;
        pathAnim.animBonus = scoreAnim.animBonus;
      }
      order.forEach(id => {
        const base = before[id] != null
          ? before[id]
          : (((getState().scores || {})[id] || 0) - (ptsById[id] || 0));
        scoreAnim.animScores[id] = base;
        scoreAnim.animBonus[id] = ptsById[id] || 0;
      });

      const DURATION = 3000;
      let idx = 0;

      function runOne() {
        if (!scoreAnim) return;
        if (idx >= order.length) {
          scoreAnim.animActive = null;
          scoreAnim.animScores = null;
          scoreAnim.animBonus = null;
          if (pathAnim) {
            pathAnim.animActive = null;
            pathAnim.animScores = null;
            pathAnim.animBonus = null;
          }
          document.querySelectorAll('.obs-score-bonus, .ps-bonus').forEach(el => el.remove());
          scoreAnim = null;
          window.dispatchEvent(new Event('map-update'));
          return;
        }
        const id = order[idx];
        const from = scoreAnim.animScores[id];
        const delta = ptsById[id] || 0;
        const to = from + delta;
        scoreAnim.animActive = id;
        scoreAnim.animActiveStarted = performance.now();
        if (pathAnim) pathAnim.animActive = id;
        try {
          const st = getState();
          st._scorePop = { pid: id, at: Date.now() };
          st._scoreGlow = { pid: id, at: Date.now() };
          stateCache = st;
        } catch (e) {}

        function frame(now) {
          if (!scoreAnim || scoreAnim.animActive !== id) return;
          const t = Math.min(1, (now - scoreAnim.animActiveStarted) / DURATION);
          const e = 1 - Math.pow(1 - t, 2);
          scoreAnim.animScores[id] = from + (to - from) * e;
          scoreAnim.animBonus[id] = delta * (1 - e);
          if (pathAnim) {
            pathAnim.animScores = scoreAnim.animScores;
            pathAnim.animBonus = scoreAnim.animBonus;
            pathAnim.animActive = id;
          }
          window.dispatchEvent(new CustomEvent('map-update', { detail: { soft: 'score-anim' } }));
          if (t < 1) {
            _scoreAnimRaf = requestAnimationFrame(frame);
          } else {
            scoreAnim.animScores[id] = to;
            scoreAnim.animBonus[id] = 0;
            document.querySelectorAll('.obs-score-bonus[data-pid="' + id + '"], .ps-entry[data-pid="' + id + '"] .ps-bonus').forEach(el => el.remove());
            idx++;
            setTimeout(runOne, 280);
          }
        }
        _scoreAnimRaf = requestAnimationFrame(frame);
        window.dispatchEvent(new Event('map-update'));
      }
      runOne();
    }

    function updateScoreAnimDom() {
      const sa = scoreAnim || (pathAnim && pathAnim.animScores ? pathAnim : null);
      if (!sa || !sa.animScores) return;
      const active = sa.animActive;
      // OBS counters
      for (const pid of [1, 2, 3, 4]) {
        const el = document.querySelector('.obs-score.p' + pid) || document.querySelector('.obs-score[data-pid="' + pid + '"]');
        if (el && sa.animScores[pid] != null) {
          el.textContent = Math.round(sa.animScores[pid]);
          if (pid === active) {
            el.classList.add('glow', 'counting');

          } else {
            el.classList.remove('counting');

          }
        }
        // floating +pts
        let bonusEl = document.querySelector('.obs-score-bonus[data-pid="' + pid + '"]');
        if (pid === active && sa.animBonus && sa.animBonus[pid] != null) {
          if (!bonusEl && el) {

            document.body.appendChild(bonusEl);

          if (bonusEl && el) {

            const b = Math.round(sa.animBonus[pid]);

        if (pid === active) entry.classList.add('ps-counting');
        else entry.classList.remove('ps-counting');
        let b = entry.querySelector('.ps-bonus');
        if (pid === active && sa.animBonus) {
          if (!b) {
            b = document.createElement('span');
            b.className = 'ps-bonus';
            entry.appendChild(b);
          }
          const v = Math.round(sa.animBonus[pid] || 0);
          b.textContent = (v > 0 ? '+' : '') + v;
          b.style.color = v < 0 ? '#ff5252' : '#fff';
        } else if (b) b.remove();
      });
    }

    function categoryIndexForRound(r) {
      if (r < 1) return -1;
      if (r <= 5) return 0;
      if (r <= 10) return 1;
      return 2;
    }
    function lampIndexForRound(r) {
      if (r < 1) return 0;
      return ((r - 1) % 5) + 1;
    }
    function needsExtraImageWait(state) {
      const r = state.currentRound;
      if (r < 11 || r > 15) return false;
      if (state.finalImageShow && state.finalImageShow.active) return false; // showing image now
      const rd = state.rounds && state.rounds[r - 1];
      // Treat missing round data as "not shown yet"
      return !(rd && rd.extraImageShown === true);
    }
    function isPlayLocked(state) {
      // Admin can always place solutions / manage
      if (typeof mode !== 'undefined' && mode === 'admin') return false;
      if (state.categoryShow && state.categoryShow.active) return true;
      if (state.finalImageShow && state.finalImageShow.active) return true;
      if (needsExtraImageWait(state)) return true;
      return false;
    }
    function timerBarColor(remainingSec) {
      // remaining: 5 → green, 2.5 → orange, 1 → red
      if (remainingSec <= 1) return '#e53935';
      if (remainingSec <= 2.5) {
        // orange to red between 2.5 and 1
        return '#fb8c00';
      }
      if (remainingSec <= 3.75) return '#fdd835'; // yellow zone
      return '#43a047';
    }
    function renderCategoryBannerHtml(state) {
      const cs = state.categoryShow;
      if (!cs || !cs.active) return '';
      const ci = cs.categoryIndex;
      const cat = (state.categories && state.categories[ci]) || { name: '', icon: null };
      const lampIdx = cs.lampIndex || 1;
      const elapsed = Date.now() - (cs.startedAt || Date.now());
      const pending = elapsed < 400; // first 0.4s lamp off
      // smooth fade pulse (~0.9s cycle) via sine opacity
      const tBlink = Math.max(0, elapsed - 400);
      const pulse = 0.5 + 0.5 * Math.sin((tBlink / 900) * Math.PI * 2); // 0..1
      const winners = state.roundWinners || {};
      const baseRound = ci * 5; // 0,5,10
      let lamps = '';
      for (let i = 1; i <= 5; i++) {
        const roundNum = baseRound + i;
        let cls = 'cat-lamp';
        let style = '';
        if (i < lampIdx) {
          const w = winners[roundNum];
          if (w === 1 || w === 2 || w === 3 || w === 4) {
            const pl = state.players[w] || {};
            const col = pl.color || (typeof DEFAULT_COLORS !== 'undefined' && DEFAULT_COLORS[w]) || '#ffc107';
            cls += ' done';
            style = `background:${col};box-shadow:0 0 12px 3px ${col}, 0 0 4px ${col}`;
          } else if (w === 'tie') {
            cls += ' done';
            style = 'background:#b0bec5;box-shadow:0 0 8px 2px #cfd8dc';
          }
        } else if (i === lampIdx) {
          if (pending) {
            cls += ' current pending';
          } else {
            cls += ' current';
            const op = 0.2 + 0.8 * pulse;
            const glow = 4 + 8 * pulse;
            style = `background:rgba(255,255,255,${(0.35+0.65*pulse).toFixed(3)});box-shadow:0 0 ${glow.toFixed(1)}px ${(2+3*pulse).toFixed(1)}px rgba(255,255,255,${(0.25+0.45*pulse).toFixed(3)});opacity:${op.toFixed(3)}`;
          }
        }
        lamps += `<div class="${cls}" style="${style}"></div>`;
      }
      return `<div class="question-banner category-banner">
        <div class="cat-head">
          ${cat.icon ? `<img class="cat-icon" src="${cat.icon}" alt="">` : ''}
          <span class="cat-title">${escapeHtml(cat.name || 'Kategorie')}</span>
        </div>
        <div class="cat-divider"></div>
        <div class="cat-lamps">${lamps}</div>
      </div>`;
    }
    function renderTimerBannerHtml(state) {

      const elapsed = Date.now() - (fi.startedAt || Date.now());
      const total = 5000;
      const left = Math.max(0, total - elapsed);
      const pct = (left / total) * 100;
      const remSec = left / 1000;
      const col = timerBarColor(remSec);
      return `<div class="question-banner timer-banner">
        <div class="timer-bar-track"><div class="timer-bar-fill" style="width:${pct}%;background:${col}"></div></div>
      </div>`;

    window.setCurrentRound = function(n) {

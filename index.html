<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>KingdomGuessr</title>
  <style>
    :root {
      --bg: #0a0a12;
      --bg-dark: #050508;
      --bar: rgba(10, 10, 18, 0.85);
      --accent: #ff1744;
      --green: #1b5e20;
      --green-hover: #2e7d32;
      --text: #ffffff;
      --card: rgba(255, 255, 255, 0.08);
      --border: rgba(255, 107, 107, 0.35);
      --glow-green: #00e676;
    }

    .galaxy-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
      background: radial-gradient(ellipse at 30% 20%, #1a1030 0%, #0a0a12 50%, #050508 100%);
    }
    .galaxy-bg canvas { width: 100%; height: 100%; display: block; }
    body.obs-mode .galaxy-bg { display: none !important; }
    body.obs-mode #obs-stage { z-index: 2; position: relative; }
    body.obs-mode {
      background: transparent !important;
    }
    .top-bar, .content, #app, h1, .subtitle, .card, .login-wrap {
      position: relative;
      z-index: 2;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: #0a0a12;
      min-height: 100vh;
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-x: hidden;
    }

    body.obs-mode {
      background: transparent !important;
      padding: 0;
      overflow: hidden;
      min-height: 100vh;
      width: 100vw;
    }

    html.obs-mode {
      background: transparent !important;
    }

    /* ===== Top Bar + Logo ===== */
    .top-bar {
      width: 100%;
      background: var(--bar);
      border-bottom: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 4px 20px rgba(0,0,0,0.45);
      backdrop-filter: blur(10px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px 16px;
      position: sticky;
      top: 0;
      z-index: 40;
    }

    .top-bar .logo {
      height: 52px;
      width: auto;
      filter: drop-shadow(0 2px 8px rgba(0,0,0,0.6));
    }

    @media (min-width: 600px) {
      .top-bar .logo { height: 68px; }
    }

    body.obs-mode .top-bar { display: none; }

    .content {
      width: 100%;
      max-width: 1100px;
      padding: 20px 16px 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h1 {
      font-size: clamp(1.25rem, 4vw, 1.85rem);
      text-align: center;
      text-shadow: 0 2px 8px rgba(0,0,0,0.4);
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }

    .subtitle {
      opacity: 0.8;
      font-size: 0.95rem;
      margin-bottom: 18px;
      text-align: center;
    }

    .card {
      background: var(--card);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 20px;
      width: 100%;
      max-width: 960px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
    }

    .status-line {
      text-align: center;
      font-size: 0.9rem;
      margin-bottom: 12px;
      font-weight: 600;
      min-height: 1.3em;
    }

    .status-line.ok { color: #81c784; }
    .status-line.err { color: #ff8a80; }
    .status-line.info { color: #ffab91; }

    /* ===== Login ===== */
    .login-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 60vh;
      width: 100%;
      max-width: 400px;
    }

    .login-card {
      background: var(--card);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 28px 24px;
      width: 100%;
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
    }

    .login-card label {
      display: block;
      margin-bottom: 8px;
      font-size: 0.95rem;
      opacity: 0.9;
    }

    .login-card input[type="password"] {
      width: 100%;
      padding: 14px 16px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.25);
      background: rgba(0,0,0,0.35);
      color: white;
      font-size: 1.15rem;
      letter-spacing: 0.2em;
      text-align: center;
      outline: none;
      margin-bottom: 12px;
    }

    .login-card input[type="password"]:focus {
      border-color: var(--login-accent, #ff1744);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--login-accent, #ff1744) 35%, transparent);
    }
    .login-card-themed {
      border-color: color-mix(in srgb, var(--login-accent, #888) 55%, rgba(255,255,255,0.15)) !important;
      box-shadow: 0 8px 32px rgba(0,0,0,0.3), 0 0 0 1px color-mix(in srgb, var(--login-accent, #888) 25%, transparent);
    }
    .login-wrap .login-btn.login-ready:not(:disabled) {
      background: linear-gradient(160deg, color-mix(in srgb, var(--login-accent, #888) 75%, #fff), var(--login-accent, #666)) !important;
      box-shadow: 0 0 18px color-mix(in srgb, var(--login-accent, #888) 60%, transparent), 0 0 6px color-mix(in srgb, var(--login-accent, #888) 45%, transparent) !important;
      animation: login-btn-pulse 1.4s ease-in-out infinite;
      color: #fff !important;
    }
    .login-wrap .login-btn {
      border: 2px solid color-mix(in srgb, var(--login-accent, #888) 40%, transparent);
    }

    .login-error {
      color: #ff8a80;
      font-size: 0.9rem;
      text-align: center;
      min-height: 1.3em;
      margin-bottom: 10px;
      font-weight: 600;
    }

    .login-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      filter: grayscale(0.4);
      box-shadow: none !important;
      background: #444 !important;
    }
    .login-btn.login-ready:not(:disabled) {
      background: linear-gradient(160deg, color-mix(in srgb, var(--login-accent, #888) 80%, #fff), var(--login-accent, #666)) !important;
      box-shadow: 0 0 16px color-mix(in srgb, var(--login-accent, #888) 55%, transparent), 0 0 4px color-mix(in srgb, var(--login-accent, #888) 40%, transparent);
      animation: login-btn-pulse 1.4s ease-in-out infinite;
      color: #fff !important;
      border-color: color-mix(in srgb, var(--login-accent, #888) 70%, #fff) !important;
    }
    @keyframes login-btn-pulse {
      0%, 100% { box-shadow: 0 0 12px color-mix(in srgb, var(--login-accent, #888) 40%, transparent); }
      50% { box-shadow: 0 0 22px color-mix(in srgb, var(--login-accent, #888) 70%, transparent), 0 0 8px color-mix(in srgb, var(--login-accent, #888) 50%, transparent); }
    }
    .login-player-head {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      margin-bottom: 6px;
    }
    .login-player-head .login-av {
      width: 72px; height: 72px; border-radius: 50%;
      object-fit: cover; border: 3px solid rgba(255,255,255,0.35);
      background: #333; box-shadow: 0 4px 18px rgba(0,0,0,0.4);
    }
    .login-player-head h1 {
      font-size: 1.6rem; margin: 0;
    }
    .login-btn, .btn {
      border: none;
      border-radius: 12px;
      padding: 12px 20px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s, background 0.2s;
    }

    .login-btn {
      width: 100%;
      background: linear-gradient(145deg, #ff1744, #d50000);
      color: white;
      box-shadow: 0 4px 14px rgba(255, 23, 68, 0.4);
    }

    .login-btn:hover, .btn:hover:not(:disabled) { transform: translateY(-2px); }
    .btn:disabled { opacity: 0.55; cursor: not-allowed; transform: none; }

    .btn-primary {
      background: linear-gradient(145deg, #ff1744, #d50000);
      color: white;
      box-shadow: 0 4px 14px rgba(255, 23, 68, 0.4);
    }

    .btn-green {
      background: linear-gradient(145deg, var(--green), #2e7d32);
      color: white;
      box-shadow: 0 4px 14px rgba(27, 94, 32, 0.45);
    }

    .btn-red {
      background: linear-gradient(145deg, #b71c1c, #c62828);
      color: white;
      box-shadow: 0 4px 14px rgba(183, 28, 28, 0.4);
    }

    .btn-secondary {
      background: rgba(255,255,255,0.12);
      color: white;
      border: 1px solid rgba(255,255,255,0.25);
    }

    .btn-sm {
      padding: 8px 14px;
      font-size: 0.9rem;
    }

    /* ===== Home ===== */
    .home-links {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .home-links a {
      display: block;
      padding: 14px;
      border-radius: 12px;
      font-weight: 700;
      text-decoration: none;
      text-align: center;
    }

    .home-links a.player {
      background: #ff1744;
      color: #fff;
      box-shadow: 0 0 10px rgba(255, 23, 68, 0.45);
    }

    .home-links a.admin {
      background: var(--green);
      color: white;
    }

    .home-links a.obs {
      background: #0d47a1;
      color: white;
    }

    .room-badge {
      background: rgba(0,0,0,0.4);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 10px;
      padding: 10px 14px;
      margin-bottom: 16px;
      font-size: 0.85rem;
      word-break: break-all;
      text-align: center;
    }

    .room-badge strong { color: #ffcdd2; }

    .note {
      margin-top: 18px;
      font-size: 0.8rem;
      opacity: 0.65;
      text-align: center;
      max-width: 560px;
      line-height: 1.45;
    }

    .links {
      margin-top: 20px;
      text-align: center;
      width: 100%;
    }

    .links a {
      display: inline-block;
      margin: 5px;
      padding: 9px 14px;
      background: rgba(255,255,255,0.1);
      border-radius: 10px;
      color: #ffcdd2;
      text-decoration: none;
      font-size: 0.88rem;
      border: 1px solid rgba(255,255,255,0.15);
    }

    .links a:hover { background: rgba(255,255,255,0.18); }

    /* ===== Map + Grid ===== */
    .map-wrap {
      position: relative;
      width: 100%;
      max-width: 720px;
      margin: 0 auto;
      user-select: none;
      /* Fixed gutters so free/grid modes don't shift the image */
      --gutter-left: 28px;
      --gutter-top: 22px;
    
      overflow: visible;
    }

    .map-labels-top {
      display: grid;
      position: absolute;
      left: var(--gutter-left);
      right: 0;
      top: 0;
      height: var(--gutter-top);
      z-index: 3;
      pointer-events: none;
    }

    .map-labels-top span {
      text-align: center;
      font-size: 0.7rem;
      font-weight: 700;
      opacity: 0.85;
      color: #ffcdd2;
      line-height: var(--gutter-top);
    }

    .map-body {
      display: block;
      position: relative;
      padding-left: var(--gutter-left);
      padding-top: var(--gutter-top);
      overflow: visible;
    }

    .map-labels-left {
      display: flex;
      flex-direction: column;
      position: absolute;
      left: 0;
      top: var(--gutter-top);
      bottom: 0;
      width: var(--gutter-left);
      z-index: 3;
      pointer-events: none;
    }

    .map-labels-left span {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.7rem;
      font-weight: 700;
      opacity: 0.85;
      color: #ffcdd2;
    }

    .map-stage {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      background: rgba(0,0,0,0.4);
      border: 4px solid var(--map-border, rgba(255,80,80,0.55));
      border-radius: 10px;
      overflow: visible; /* pin heads can stick out past the edge */
      box-sizing: border-box;
      z-index: 20;
    }
    .map-clip {
      position: absolute;
      inset: 0;
      border-radius: inherit;
      overflow: hidden;
      z-index: 1;
      pointer-events: none;
    }
    .map-clip > * { pointer-events: auto; }
    /* Lines under pins; pins can stick out past map edge */
    .map-stage > .path-svg {
      z-index: 12 !important;
    }
    .map-stage > .solution-dot {
      z-index: 14;
    }
    .map-stage > .map-pin {
      z-index: 40 !important;
    }
    .map-stage > .reveal-result-box,
    .map-stage > .spy-pick-box {
      z-index: 50;
    }

    .map-stage img.map-img {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      pointer-events: none;
      transform: translate(-50%, -50%) scale(var(--map-zoom, 1));
      transform-origin: center center;
    }

    .map-stage .map-placeholder {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0.45;
      font-size: 0.95rem;
      text-align: center;
      padding: 16px;
    }

    .grid-overlay {
      position: absolute;
      inset: 0;
      display: grid;
      pointer-events: none;
    }

    .grid-overlay.interactive {
      pointer-events: auto;
    }

    .grid-cell {
      border: 1px solid rgba(255, 255, 255, 0.22);
      background: transparent;
      position: relative;
      cursor: pointer;
      transition: background 0.12s, box-shadow 0.15s;
    }

    .grid-cell:hover {
      background: rgba(255, 255, 255, 0.08);
    }

    .grid-cell.hover-p1,
    .grid-cell.hover-p2 {
      background: transparent;
    }

    .grid-cell.confirmed-p1 {
      background: color-mix(in srgb, var(--p1-color, #ff1744) 42%, transparent);
      box-shadow:
        inset 0 0 0 2px var(--p1-color, #ff1744),
        0 0 10px 2px color-mix(in srgb, var(--p1-color, #ff1744) 45%, transparent);
      z-index: 2;
    }

    .grid-cell.confirmed-p2 {
      background: color-mix(in srgb, var(--p2-color, #2196f3) 42%, transparent);
      box-shadow:
        inset 0 0 0 2px var(--p2-color, #2196f3),
        0 0 10px 2px color-mix(in srgb, var(--p2-color, #2196f3) 45%, transparent);
      z-index: 2;
    }

    .grid-cell.solution-cell {
      background: rgba(0, 230, 118, 0.35) !important;
      box-shadow: inset 0 0 0 3px #00e676 !important;
    }

    .grid-cell.selected {
      background: transparent;
      animation: select-breathe 1.8s ease-in-out infinite;
    }

    @keyframes select-breathe {
      0%, 100% {
        box-shadow: inset 0 0 0 2px rgba(255,255,255,0.5), 0 0 6px 1px rgba(255,255,255,0.18);
      }
      50% {
        box-shadow: inset 0 0 0 2px rgba(255,255,255,0.85), 0 0 12px 3px rgba(255,255,255,0.32);
      }
    }

    .grid-cell.pulse {
      animation: cell-pulse 0.55s ease-out;
    }

    @keyframes cell-pulse {
      0% { transform: scale(1); }
      35% { transform: scale(1.12); box-shadow: 0 0 18px 4px rgba(255, 215, 0, 0.7); }
      100% { transform: scale(1); }
    }

    .grid-cell.login-zoom {
      animation: login-pop 0.55s cubic-bezier(0.34, 1.4, 0.64, 1);
      z-index: 5;
    }

    @keyframes login-pop {
      0% { transform: scale(1); }
      40% { transform: scale(1.32); }
      100% { transform: scale(1); }
    }

    .avatar-on-cell {
      position: absolute;
      width: 80%;
      height: 80%;
      left: 10%;
      top: 10%;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid currentColor;
      box-shadow: 0 0 8px currentColor;
      pointer-events: none;
      z-index: 6;
    }

    .avatar-on-cell.no-frame {
      border-color: transparent;
      box-shadow: 0 2px 8px rgba(0,0,0,0.45);
    }

    .avatar-on-cell.dual-tl {
      width: 48%;
      height: 48%;
      left: 4%;
      top: 4%;
    }

    .avatar-on-cell.dual-br {
      width: 48%;
      height: 48%;
      left: 48%;
      top: 48%;
    }

    .grid-cell.split-glow {
      box-shadow: none !important;
      background: transparent !important;
    }

    .grid-cell.split-glow::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: inherit;
      pointer-events: none;
      z-index: 1;
      /* top-left player color on TL corner, bottom-right on BR */
      background:
        linear-gradient(135deg,
          color-mix(in srgb, var(--split-tl, #ff1744) 40%, transparent) 0%,
          color-mix(in srgb, var(--split-tl, #ff1744) 40%, transparent) 48%,
          transparent 52%,
          color-mix(in srgb, var(--split-br, #2196f3) 40%, transparent) 52%,
          color-mix(in srgb, var(--split-br, #2196f3) 40%, transparent) 100%);
      box-shadow:
        inset 2px 2px 0 0 var(--split-tl, #ff1744),
        inset -2px -2px 0 0 var(--split-br, #2196f3),
        -2px -2px 10px -2px var(--split-tl, #ff1744),
        2px 2px 10px -2px var(--split-br, #2196f3);
    }

    .question-banner {
      width: 100%;
      max-width: 720px;
      margin-bottom: 12px;
      margin-left: auto;
      margin-right: auto;
      padding: 12px 16px;
      background: rgba(0,0,0,0.35);
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 12px;
      min-height: 64px;
      box-sizing: border-box;
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .question-banner.empty {
      opacity: 0.5;
      font-weight: 500;
      justify-content: center;
    }
    .question-banner .q-img {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      object-fit: cover;
      flex-shrink: 0;
      border: 2px solid rgba(255,255,255,0.3);
      background: rgba(0,0,0,0.3);
    }
    .question-banner .q-text {
      flex: 1;
      font-size: 1.1rem;
      font-weight: 700;
      line-height: 1.35;
      text-align: center;
    }

    .joker-alert {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 40;
      min-width: 260px;
      max-width: 360px;
      padding: 14px 16px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      gap: 12px;
      pointer-events: none;
      animation: joker-alert-in 0.35s ease-out;
    }
    @keyframes joker-alert-in {
      from { opacity: 0; transform: translate(-50%, -50%) scale(0.92); }
      to { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    }
    .joker-alert .ja-icon {
      width: 44px; height: 44px; border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; border: 2px solid rgba(255,255,255,0.35);
    }
    .joker-alert .ja-body { flex: 1; min-width: 0; }
    .joker-alert .ja-title {
      font-weight: 800; font-size: 1rem; color: #fff;
      text-shadow: 0 1px 4px rgba(0,0,0,0.4);
    }
    .joker-alert .ja-desc {
      font-size: 0.75rem; color: rgba(255,255,255,0.65);
      margin-top: 3px; line-height: 1.3;
    }
    .joker-alert .ja-av {
      width: 44px; height: 44px; border-radius: 50%;
      object-fit: cover; border: 2px solid rgba(255,255,255,0.5); flex-shrink: 0;
    }


    .map-pin {
      position: absolute;
      width: 52px;
      height: 68px;
      transform: translate(-50%, -100%);
      pointer-events: none;
      z-index: 40; /* above question banner when head sticks out past map edge */
      transition: left 0.12s linear, top 0.12s linear;
    }
    .map-pin .pin-head {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      border: 3px solid #fff;
      overflow: hidden;
      margin: 0 auto;
      background: #333;
      box-shadow: 0 3px 12px rgba(0,0,0,0.5);
    }
    .map-pin .pin-head img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .map-pin .pin-point {
      width: 0;
      height: 0;
      margin: -3px auto 0;
      border-left: 11px solid transparent;
      border-right: 11px solid transparent;
      border-top: 18px solid #fff;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.4));
    }
    .map-pin.selected .pin-head {
      box-shadow: 0 0 0 3px rgba(255,255,255,0.9), 0 0 12px 3px rgba(255,255,255,0.45);
    }
    .map-pin.logged .pin-head { border-width: 3px; }
    .map-pin.glow-gold .pin-head {
      box-shadow: 0 0 0 3px #ffc107, 0 0 16px 4px rgba(255,193,7,0.75);
    }
    .map-pin.glow-silver .pin-head {
      box-shadow: 0 0 0 3px #b0bec5, 0 0 16px 4px rgba(176,190,197,0.75);
    }

    .phase-badges {
      display: flex;
      gap: 12px;
      justify-content: center;
      margin-top: 14px;
    }
    .phase-badge {
      width: 72px;
      height: 56px;
      border-radius: 12px;
      background: rgba(40,40,40,0.55);
      border: 2px solid rgba(255,255,255,0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0.35;
      filter: grayscale(0.6);
      overflow: hidden;
    }
    .phase-badge img {
      width: 36px;
      height: 36px;
      object-fit: contain;
    }
    .phase-badge.active {
      opacity: 1;
      filter: none;

  <script>

    function initGalaxy() {
      const canvas = document.getElementById('galaxyCanvas');
      if (!canvas || canvas._galaxyRunning) return;
      canvas._galaxyRunning = true;
      const ctx = canvas.getContext('2d');
      let w = 0, h = 0, t0 = performance.now();

      function resize() {
        w = canvas.width = window.innerWidth;
        h = canvas.height = window.innerHeight;
      }
      resize();
      window.addEventListener('resize', resize);

      const HUES = [200, 220, 260, 280, 310, 340, 30, 50, 170, 190];
      const stars = [];
      for (let i = 0; i < 140; i++) {
        stars.push({
          x: Math.random(), y: Math.random(),
          z: 0.15 + Math.random() * 0.85,
          tw: Math.random() * Math.PI * 2,
          tws: 0.25 + Math.random() * 1.4,
          size: 0.3 + Math.random() * 2.2,
          hue: HUES[(Math.random() * HUES.length) | 0],
          flashAt: 3 + Math.random() * 12,
          flashDur: 0.35 + Math.random() * 0.5
        });
      }
      const trails = [];
      for (let i = 0; i < 36; i++) {
        const ang = Math.random() * Math.PI * 2;
        // speed range: slow min ~0.08, max ~0.45 (normalized later)
        const sp = 0.08 + Math.random() * 0.35;
        trails.push({
          x: Math.random(), y: Math.random(),
          vx: Math.cos(ang) * sp * 0.0012,
          vy: Math.sin(ang) * sp * 0.0012,
          hist: [],
          alpha: 0.18 + Math.random() * 0.55,
          width: 0.4 + Math.random() * 2.4,
          hue: HUES[(Math.random() * HUES.length) | 0],
          flashT: 4 + Math.random() * 10,
          flashPhase: Math.random() * Math.PI * 2
        });
      }
      const nebulae = [
        { x: 0.25, y: 0.2, r: 0.5, c: [70, 25, 120], a: 0.24 },
        { x: 0.75, y: 0.68, r: 0.42, c: [20, 50, 110], a: 0.2 },
        { x: 0.5, y: 0.45, r: 0.32, c: [90, 20, 70], a: 0.14 },
        { x: 0.12, y: 0.78, r: 0.28, c: [30, 70, 90], a: 0.12 },
        { x: 0.88, y: 0.25, r: 0.22, c: [50, 30, 100], a: 0.1 }
      ];

      function tick(now) {
        if (!w || !h) { requestAnimationFrame(tick); return; }
        const t = (now - t0) / 1000;
        ctx.fillStyle = '#05050c';
        ctx.fillRect(0, 0, w, h);

        nebulae.forEach((n, i) => {
          const px = (n.x + Math.sin(t * 0.04 + i) * 0.035) * w;
          const py = (n.y + Math.cos(t * 0.035 + i * 1.2) * 0.03) * h;
          const rr = n.r * Math.max(w, h);
          const g = ctx.createRadialGradient(px, py, 0, px, py, rr);
          const [cr, cg, cb] = n.c;
          const pulse = n.a * (0.8 + 0.2 * Math.sin(t * 0.28 + i));
          g.addColorStop(0, 'rgba(' + cr + ',' + cg + ',' + cb + ',' + pulse + ')');
          g.addColorStop(1, 'rgba(' + cr + ',' + cg + ',' + cb + ',0)');
          ctx.fillStyle = g;
          ctx.fillRect(0, 0, w, h);
        });

        stars.forEach(s => {
          let tw = 0.3 + 0.7 * (0.5 + 0.5 * Math.sin(t * s.tws + s.tw));
          // occasional flash
          const cycle = (t + s.tw * 3) % (s.flashAt + s.flashDur);
          if (cycle > s.flashAt) {
            const f = (cycle - s.flashAt) / s.flashDur;
            tw = Math.min(1.5, tw + Math.sin(f * Math.PI) * 1.2);
          }
          const sx = ((s.x + t * 0.0025 * s.z) % 1 + 1) % 1 * w;
          const sy = ((s.y + t * 0.0018 * s.z) % 1 + 1) % 1 * h;
          ctx.beginPath();
          ctx.fillStyle = 'hsla(' + s.hue + ',70%,90%,' + (Math.min(1, tw) * s.z * 0.75) + ')';
          ctx.arc(sx, sy, s.size * s.z * (tw > 1 ? 1.3 : 1), 0, Math.PI * 2);
          ctx.fill();
        });

        trails.forEach(tr => {
          tr.x += tr.vx;
          tr.y += tr.vy;
          if (tr.x < 0 || tr.x > 1) tr.vx *= -1;
          if (tr.y < 0 || tr.y > 1) tr.vy *= -1;
          tr.x = Math.max(0, Math.min(1, tr.x));
          tr.y = Math.max(0, Math.min(1, tr.y));
          // soft speed bounds
          let sp = Math.sqrt(tr.vx * tr.vx + tr.vy * tr.vy) || 0.0001;
          const minSp = 0.00008, maxSp = 0.00055;
          if (sp > maxSp) { tr.vx *= maxSp / sp; tr.vy *= maxSp / sp; }
          if (sp < minSp) { tr.vx *= minSp / sp; tr.vy *= minSp / sp; }
          tr.vx += (Math.random() - 0.5) * 0.000015;
          tr.vy += (Math.random() - 0.5) * 0.000015;

          // mid-flight color pulse
          const flash = 0.5 + 0.5 * Math.sin(t * 0.7 + tr.flashPhase);
          const boost = ((t + tr.flashPhase) % tr.flashT) > (tr.flashT - 0.6)
            ? Math.sin(((t + tr.flashPhase) % tr.flashT - (tr.flashT - 0.6)) / 0.6 * Math.PI)
            : 0;

          const px = tr.x * w, py = tr.y * h;
          tr.hist.push({ x: px, y: py });
          if (tr.hist.length > 18) tr.hist.shift();
          for (let i = 1; i < tr.hist.length; i++) {
            const a = tr.hist[i - 1], b = tr.hist[i];
            const fade = i / tr.hist.length;
            const al = tr.alpha * fade * (0.55 + boost * 0.45);
            ctx.beginPath();
            ctx.strokeStyle = 'hsla(' + tr.hue + ',' + (60 + boost * 30) + '%,' + (75 + boost * 15) + '%,' + al + ')';
            ctx.lineWidth = tr.width * fade * (1 + boost * 0.4);
            ctx.lineCap = 'round';
            ctx.moveTo(a.x, a.y);
            ctx.lineTo(b.x, b.y);
            ctx.stroke();
          }
          ctx.beginPath();
          ctx.fillStyle = 'hsla(' + tr.hue + ',80%,92%,' + (tr.alpha * (0.5 + boost * 0.5)) + ')';
          ctx.arc(px, py, tr.width * (1.1 + boost * 0.8), 0, Math.PI * 2);
          ctx.fill();
        });

        requestAnimationFrame(tick);
      }
      requestAnimationFrame(tick);
    }

    let loginVolume = 0.7;
    try {
      const v = localStorage.getItem(VOLUME_KEY);
      if (v !== null) {
        const n = parseFloat(v);
        if (!isNaN(n) && n >= 0 && n <= 1) loginVolume = n;
      }
    } catch (e) {}
    let audioCtx = null;
    let lastLoginSoundHash = '';

    function getAudioCtx() {
      if (!audioCtx) {
        try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
      }
      if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
      return audioCtx;
    }

    function setLoginVolume(v) {
      loginVolume = Math.max(0, Math.min(1, v));
      try { localStorage.setItem(VOLUME_KEY, String(loginVolume)); } catch (e) {}
    }



    function playGameSfx(kind) {
      if (typeof mode !== 'undefined' && mode === 'admin') return;
      if (loginVolume <= 0) return;
      const ctx = getAudioCtx();
      if (!ctx) return;
      try {
        const now = ctx.currentTime;
        const master = ctx.createGain();
        master.connect(ctx.destination);
        const vol = loginVolume * 0.55;

        if (kind === 'solution') {
          // soft rising coin-ish ping
          master.gain.setValueAtTime(0, now);
          master.gain.linearRampToValueAtTime(vol * 0.55, now + 0.02);
          master.gain.exponentialRampToValueAtTime(0.001, now + 0.45);
          const o = ctx.createOscillator();
          o.type = 'sine';
          o.frequency.setValueAtTime(520, now);
          o.frequency.exponentialRampToValueAtTime(780, now + 0.18);
          const g = ctx.createGain();
          g.gain.setValueAtTime(0.7, now);
          o.connect(g); g.connect(master);
          const o2 = ctx.createOscillator();
          o2.type = 'triangle';
          o2.frequency.setValueAtTime(1040, now + 0.05);
          o2.frequency.exponentialRampToValueAtTime(520, now + 0.35);
          const g2 = ctx.createGain();
          g2.gain.setValueAtTime(0.2, now);
          o2.connect(g2); g2.connect(master);
          o.start(now); o2.start(now);
          o.stop(now + 0.5); o2.stop(now + 0.5);
        } else if (kind === 'line1') {
          master.gain.setValueAtTime(0, now);
          master.gain.linearRampToValueAtTime(vol * 0.5, now + 0.015);
          master.gain.exponentialRampToValueAtTime(0.001, now + 0.32);
          const o = ctx.createOscillator();
          o.type = 'sine';
          o.frequency.setValueAtTime(440, now);
          o.frequency.exponentialRampToValueAtTime(660, now + 0.12);
          o.connect(master);
          o.start(now); o.stop(now + 0.35);
        } else if (kind === 'line2') {
          master.gain.setValueAtTime(0, now);
          master.gain.linearRampToValueAtTime(vol * 0.48, now + 0.015);
          master.gain.exponentialRampToValueAtTime(0.001, now + 0.36);
          const o = ctx.createOscillator();
          o.type = 'sine';
          o.frequency.setValueAtTime(370, now);
          o.frequency.exponentialRampToValueAtTime(520, now + 0.14);
          o.connect(master);
          o.start(now); o.stop(now + 0.4);
        } else if (kind === 'result') {
          // soft success + light applause-ish noise
          master.gain.setValueAtTime(0, now);
          master.gain.linearRampToValueAtTime(vol * 0.5, now + 0.03);
          master.gain.exponentialRampToValueAtTime(0.001, now + 0.9);
          [523.25, 659.25, 783.99].forEach((f, i) => {
            const o = ctx.createOscillator();
            o.type = 'sine';
            o.frequency.setValueAtTime(f, now + i * 0.04);
            const g = ctx.createGain();
            g.gain.setValueAtTime(0.22, now + i * 0.04);
            g.gain.exponentialRampToValueAtTime(0.001, now + 0.7);
            o.connect(g); g.connect(master);
            o.start(now + i * 0.04);
            o.stop(now + 0.85);
          });
          // soft crowd clap texture
          const bufLen = Math.floor(ctx.sampleRate * 0.55);
          const buf = ctx.createBuffer(1, bufLen, ctx.sampleRate);
          const data = buf.getChannelData(0);
          for (let i = 0; i < bufLen; i++) {
            const t = i / ctx.sampleRate;
            const env = Math.exp(-3.2 * t) * (0.5 + 0.5 * Math.sin(t * 40));
            data[i] = (Math.random() * 2 - 1) * env * 0.25;
          }
          const noise = ctx.createBufferSource();
          noise.buffer = buf;
          const ng = ctx.createGain();
          ng.gain.setValueAtTime(vol * 0.35, now + 0.05);
          ng.gain.exponentialRampToValueAtTime(0.001, now + 0.7);
          const filter = ctx.createBiquadFilter();
          filter.type = 'bandpass';
          filter.frequency.value = 1800;
          filter.Q.value = 0.7;
          noise.connect(filter); filter.connect(ng); ng.connect(master);
          noise.start(now + 0.05);
          noise.stop(now + 0.75);
        } else if (kind === 'category') {
          master.gain.setValueAtTime(0, now);
          master.gain.linearRampToValueAtTime(vol * 0.45, now + 0.02);
          master.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
          const o = ctx.createOscillator();
          o.type = 'sine';
          o.frequency.setValueAtTime(392, now);
          o.frequency.exponentialRampToValueAtTime(523, now + 0.2);
          const g = ctx.createGain();
          g.gain.setValueAtTime(0.55, now);
          o.connect(g); g.connect(master);
          const o2 = ctx.createOscillator();
          o2.type = 'triangle';
          o2.frequency.setValueAtTime(784, now + 0.08);
          const g2 = ctx.createGain();
          g2.gain.setValueAtTime(0.18, now);
          o2.connect(g2); g2.connect(master);
          o.start(now); o2.start(now);
          o.stop(now + 0.55); o2.stop(now + 0.55);
        }
      } catch (e) {}
    }

    function playLoginSound() {
      const ctx = getAudioCtx();
      if (!ctx || loginVolume <= 0) return;
      try {
        const now = ctx.currentTime;
        const master = ctx.createGain();
        master.gain.setValueAtTime(0, now);
        master.gain.linearRampToValueAtTime(loginVolume * 0.7, now + 0.01);
        master.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
        master.connect(ctx.destination);

        const o1 = ctx.createOscillator();
        o1.type = 'sine';
        o1.frequency.setValueAtTime(520, now);
        o1.frequency.exponentialRampToValueAtTime(780, now + 0.12);
        const g1 = ctx.createGain();
        g1.gain.setValueAtTime(0.5, now);
        o1.connect(g1); g1.connect(master);

        const o2 = ctx.createOscillator();
        o2.type = 'triangle';
        o2.frequency.setValueAtTime(260, now);
        o2.frequency.linearRampToValueAtTime(390, now + 0.18);
        const g2 = ctx.createGain();
        g2.gain.setValueAtTime(0.25, now);
        o2.connect(g2); g2.connect(master);

        o1.start(now); o2.start(now);
        o1.stop(now + 0.4); o2.stop(now + 0.4);
      } catch (e) {}
    }

    function maybePlayLoginSound(state) {
      // Login-Sound + Aura nur in OBS-Browserquelle
      if (mode !== 'obs') return;
      const parts = [];
      for (let i = 1; i <= 4; i++) {
        if (state.players[i] && state.players[i].loggedIn) parts.push(String(i));
      }
      const h = parts.join(',');
      if (h && h !== lastLoginSoundHash) {
        const prev = lastLoginSoundHash.split(',').filter(Boolean);
        const now = parts;
        const newly = now.filter(x => !prev.includes(x));
        lastLoginSoundHash = h;
        if (newly.length) {
          playLoginSound();
          newly.forEach(s => {
            const pid = parseInt(s, 10);
            localLoginPop[pid] = true;
            setTimeout(() => {
              localLoginPop[pid] = false;
              if (mode === 'obs') render();
            }, 1200);
          });
          render(); // show aura immediately
        }
      } else if (!h) {
        lastLoginSoundHash = '';
      }
    }

    function normalizeState(s) {
      if (!s || !s.players) s = makeDefaultState();
      if (s.playerCount !== 4) s.playerCount = 2;
      for (let i = 1; i <= 4; i++) {
        if (!s.players[i]) s.players[i] = emptyPlayer(i);
        const p = s.players[i];
        if (p.name === undefined) p.name = DEFAULT_NAMES[i];
        if (p.color === undefined) p.color = DEFAULT_COLORS[i];
        if (p.hover === undefined) p.hover = null;
        if (p.selected === undefined) p.selected = null;
        if (p.confirmed === undefined) p.confirmed = null;
        if (p.loggedIn === undefined) p.loggedIn = false;
        if (!p.jokers) p.jokers = { spy: true, half: true, x2: true };
        if (p.jokers.spy === undefined) p.jokers.spy = true;
        if (p.jokers.half === undefined) p.jokers.half = true;
        if (p.jokers.x2 === undefined) p.jokers.x2 = true;
        delete p.jokers.bulb;
        delete p.jokers.row;
        if (p.spyRadius === undefined) p.spyRadius = null;
        if (p.halfCover === undefined) p.halfCover = null;
        if (p.x2Active === undefined) p.x2Active = false;
        if (p.spyTarget === undefined) p.spyTarget = null;
        delete p.blackoutOn;
        delete p.spyReveal;
        delete p.rowHint;
        delete p.joker;
        delete p.jokerUsed;
        delete p.loginPop;
        delete p.gridSize;
      }
      s.gridSize = 0; // pin-only mode
      if (s.mapZoom === undefined) s.mapZoom = 1;
      if (s.mapPublished === undefined) s.mapPublished = false;
      if (s.mapVersion === undefined) s.mapVersion = 0;
      if (s.currentRound === undefined) s.currentRound = 0;
      if (!s.obsJokerLayout1) s.obsJokerLayout1 = s.obsJokerLayout || { x: 72, y: 6, size: 44 };
      if (!s.obsJokerLayout2) s.obsJokerLayout2 = { x: 72, y: 22, size: 44 };
      if (!s.obsQuestionLayout) s.obsQuestionLayout = { x: 50, y: 4, w: 420, scale: 1 };
      if (s.obsQuestionLayout.scale == null) s.obsQuestionLayout.scale = 1;
      if (!s.obsMapLayout) s.obsMapLayout = { x: 50, y: 50, scale: 1 };
      if (!s.obsCtrlLayout) s.obsCtrlLayout = { x: 8, y: 70, scale: 1 };
      if (s.obsCtrlLayout.scale == null) s.obsCtrlLayout.scale = 1;
      if (!s.obsJokerLayout3) s.obsJokerLayout3 = { x: 72, y: 38, size: 44 };
      if (!s.obsJokerLayout4) s.obsJokerLayout4 = { x: 72, y: 54, size: 44 };
      if (!s.obsScoreLayout1) s.obsScoreLayout1 = { x: 12, y: 88, size: 64 };
      if (!s.obsScoreLayout2) s.obsScoreLayout2 = { x: 88, y: 88, size: 64 };
      if (!s.obsScoreLayout3) s.obsScoreLayout3 = { x: 12, y: 94, size: 64 };
      if (!s.obsScoreLayout4) s.obsScoreLayout4 = { x: 88, y: 94, size: 64 };
      if (!s.scores) s.scores = { 1: 0, 2: 0, 3: 0, 4: 0 };
      for (let i = 1; i <= 4; i++) if (s.scores[i] == null) s.scores[i] = 0;
      if (!s.mapBorderColor) s.mapBorderColor = '#e53935';
      if (s.mapBorderEnabled === undefined) s.mapBorderEnabled = true;
      if (s.jokerRoundUsed === undefined) s.jokerRoundUsed = null;
      if (s.lastObsJokerMsg === undefined) s.lastObsJokerMsg = null;
      if (!Array.isArray(s.categories) || s.categories.length !== 3) {
        s.categories = [
          { name: '', icon: null },
          { name: '', icon: null },
          { name: '', icon: null }
        ];
      } else {
        s.categories = s.categories.map(c => ({
          name: (c && c.name) ? String(c.name) : '',
          icon: (c && c.icon) ? c.icon : null
        }));
      }
      if (!s.roundWinners || typeof s.roundWinners !== 'object') s.roundWinners = {};
      if (s.finalImage === undefined) s.finalImage = null;
      if (s.finalImageShown === undefined) s.finalImageShown = false;
      if (s.finalImageShow === undefined) s.finalImageShow = null;
      if (s.categoryShow === undefined) s.categoryShow = null;
      if (s._resultClosed === undefined) s._resultClosed = false;
      delete s.phaseIcons;
      delete s.phaseColors;
      delete s.obsPhaseLayout;
      delete s.gridHidden;
      delete s.obsJokerLayout;
      if (!Array.isArray(s.rounds) || s.rounds.length !== 15) {
        s.rounds = Array.from({ length: 15 }, () => ({ x: null, y: null, question: '', questionImg: null }));
      } else {
        s.rounds = s.rounds.map(r => ({
          x: r && r.x != null ? r.x : null,
          y: r && r.y != null ? r.y : null,
          question: (r && r.question) ? String(r.question) : '',
          questionImg: (r && r.questionImg) ? r.questionImg : null,
          extraImage: (r && r.extraImage) ? r.extraImage : null,
          extraImageShown: !!(r && r.extraImageShown)
        }));
      }
      if (s.phase === undefined) s.phase = 'play';
      if (s.winner === undefined) s.winner = null;
      if (s.revealRound === undefined) s.revealRound = null;
      if (s.obsLayouts2 === undefined) s.obsLayouts2 = null;
      if (s.obsLayouts4 === undefined) s.obsLayouts4 = null;
      return s;
    }

    function saveLocalAvatars(avs) {
      // Always update memory first (even if localStorage fails / quota)
      localAvatars = normalizeAvatarsObj(avs || localAvatars);
      for (const pid of [1, 2, 3, 4]) {

      // also try combined blob (best effort)

        }));

    function loadLocalAvatars() {
      const next = { 1: null, 2: null, 3: null, 4: null };
      for (const pid of [1, 2, 3, 4]) {
        try {
          const raw = localStorage.getItem(avatarLsKey(pid));
          if (raw && raw.indexOf('data:') === 0) next[pid] = raw;
        } catch (e) {}
      }
      // migrate old combined JSON if per-player empty
      if (!next[1] && !next[2] && !next[3] && !next[4]) {
        try {
          const key = LOCAL_AVATAR_KEY + (roomId ? '_' + roomId : '');
          const raw = localStorage.getItem(key);
          if (raw) {
            const o = JSON.parse(raw);
            for (const pid of [1, 2, 3, 4]) {
              const v = o[pid] || o[String(pid)];
              if (v && String(v).indexOf('data:') === 0) next[pid] = v;
            }
          }
        } catch (e) {}
      }
      localAvatars = next;
      return localAvatars;
    }

    // ===== Image compress =====
    function compressImage(dataUrl, maxSide, quality) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => {
          try {
            let w = img.naturalWidth || img.width;
            let h = img.naturalHeight || img.height;
            if (!w || !h) { resolve(dataUrl); return; }
            const scale = Math.min(1, maxSide / Math.max(w, h));
            w = Math.max(1, Math.round(w * scale));
            h = Math.max(1, Math.round(h * scale));
            const canvas = document.createElement('canvas');
            canvas.width = w;
            canvas.height = h;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#1a0808';
            ctx.fillRect(0, 0, w, h);
            ctx.drawImage(img, 0, 0, w, h);
            resolve(canvas.toDataURL('image/jpeg', quality));
          } catch (e) { reject(e); }
        };
        img.onerror = () => reject(new Error('Bild konnte nicht geladen werden'));
        img.src = dataUrl;
      });
    }

    function generateRoomId() {
      const chars = 'abcdefghijklmnopqrstuvwxyz0123456789';
      let id = '';
      for (let i = 0; i < 8; i++) id += chars[Math.floor(Math.random() * chars.length)];
      return id;
    }

    async function createRemoteRoom() {
      const id = generateRoomId();
      const init = stateForRemote(makeDefaultState());
      const { data, error } = await sb.from('rooms').insert({ id, state: init }).select('id').single();
      if (error) {
        console.error('createRemoteRoom error:', error);
        throw error;
      }
      return data.id;
    }

    async function fetchRemoteState(id) {
      const { data, error } = await sb
        .from('rooms')
        .select('state')
        .eq('id', id)
        .maybeSingle();
      if (error) {
        console.error('fetchRemoteState error:', error);
        throw error;
      }
      if (!data) return null;
      return normalizeState(data.state);
    }

    async function pushRemoteState(id, state) {
      const slim = stateForRemote(state);
      const { error } = await sb
        .from('rooms')
        .update({ state: slim })
        .eq('id', id);
      if (error) {
        console.error('pushRemoteState error:', error);
        throw error;
      }
      return true;
    }

        realtimeChannel.send({
          type: 'broadcast',
          event: 'map',
          payload: {
            version: (getState().mapVersion || 0),

          }
